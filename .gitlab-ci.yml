image: oven/bun:1-alpine

stages:
  - install
  - test
  - build
  - deploy

cache:
  paths:
    - node_modules/

install_dependencies:
  stage: install
  script:
    - HUSKY=0 bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/

lint_and_test:
  stage: test
  script:
    - bun run lint
    - bun run test
  needs:
    - install_dependencies

integration_test:
  stage: test
  script:
    - bun run test:integration
  needs:
    - install_dependencies
  allow_failure: true

build_package:
  stage: build
  script:
    - bun run build
  needs:
    - install_dependencies
  artifacts:
    paths:
      - dist/

release:
  stage: deploy
  resource_group: meonode_canvas_pipeline_lock
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "alpha"
  script:
    - apk add git
    - bunx semantic-release
  needs:
    - lint_and_test
    - build_package
  environment:
    name: production
