image: oven/bun:1-alpine

stages:
  - install
  - test
  - build
  - deploy

cache:
  key:
    files:
      - bun.lock
  paths:
    - node_modules/

.node_with_bun: &node_with_bun
  # Pinned to the `engines.node` floor, not `node:alpine`. Floating meant CI only ever ran on the
  # newest Node, so the declared minimum was never exercised and could have broken silently.
  image: node:22-alpine
  before_script:
    - node --version
    - apk add --no-cache curl unzip bash
    - curl -fsSL https://bun.sh/install | bash
    - export BUN_INSTALL="$HOME/.bun"
    - export PATH="$BUN_INSTALL/bin:$PATH"

install_dependencies:
  stage: install
  script:
    - HUSKY=0 bun install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/

lint_and_test:
  <<: *node_with_bun
  stage: test
  script:
    - bun run lint
    - bun run test:ci
  needs:
    - install_dependencies

integration_test:
  stage: test
  script:
    - bun run test:integration
  needs:
    - install_dependencies
  allow_failure: true

build_package:
  stage: build
  script:
    - bun run build
  needs:
    - install_dependencies
  artifacts:
    paths:
      - dist/

release:
  <<: *node_with_bun
  stage: deploy
  resource_group: meonode_canvas_pipeline_lock
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "beta" || $CI_COMMIT_BRANCH == "alpha"
  script:
    - apk add --no-cache git
    - bun x semantic-release
  needs:
    - lint_and_test
    - build_package
  environment:
    name: production
