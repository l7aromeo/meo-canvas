[package]
name = "meo-canvas-node"
description = "The Node.js addon for meo-canvas: the single Neon module entry point for the shipped binary."
keywords = ["canvas", "nodejs", "neon", "addon", "rendering"]
categories = ["graphics", "rendering", "api-bindings"]
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lib]
# `cdylib` only. There is no `rlib`: nothing depends on this crate from Rust, and
# offering one would invite a dependency that drags Neon into a Rust-only build.
crate-type = ["cdylib"]

# A build naming both `metal` and `vulkan` compiles and is a Metal build:
# meo-skia-canvas gives Metal precedence, the overlap being reachable only on
# macOS. Cargo unifies features, so two dependencies wanting different backends
# get both, and `RenderedCanvas::engine` reports which one is live.
[features]
# The GPU backend, chosen at build time and named by the platform that has one:
# Metal on Apple targets, Vulkan elsewhere. Neither is default -- a build with
# no backend named renders on the CPU, which is what a portable `cargo check`
# needs and what CI runs before it picks a host.
default = []
metal = ["meo-skia-canvas/metal"]
vulkan = ["meo-skia-canvas/vulkan"]

[dependencies]
meo-canvas-core = { workspace = true }
meo-canvas-scene = { workspace = true }
neon = { workspace = true }
# The pool `encodeAsync` runs on; the workspace entry says why it is not
# `cx.task`.
rayon = { workspace = true }
# Named here as well as under `meo-canvas-core` so the addon can re-export the
# backend's surface to JavaScript. The workspace entry's `default-features =
# false` keeps its `node-addon` feature, and so its `#[neon::main]`, out: a
# `.node` has one module-init symbol, the one in `src/lib.rs`.
meo-skia-canvas = { workspace = true }

[lints]
workspace = true

# Skipped by `cargo-machete`. `src` imports all three, so the list hides nothing
# the tool would report.
[package.metadata.cargo-machete]
ignored = ["meo-canvas-core", "meo-canvas-scene", "meo-skia-canvas"]
