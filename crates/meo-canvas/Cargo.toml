[package]
name = "meo-canvas"
description = "Declarative 2D scene rendering on Skia with CSS flexbox, grid and block layout."
keywords = ["canvas", "layout", "flexbox", "grid", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# **Naming both `metal` and `vulkan` builds, and Metal wins.** It did not
# before 0.12.1: meo-skia-canvas bound both engines to one `Engine` name and a
# build with both was `error[E0252]` inside a crate the caller never named
# (l7aromeo/meo-skia-canvas#36). Upstream fixed it by precedence rather than by
# refusal -- `#[cfg(all(feature = "vulkan", not(feature = "metal")))]` on the
# module, the engine and the renderer -- because the overlap is only reachable
# on macOS, where Vulkan runs through MoltenVK anyway.
#
# So the failure mode changed rather than went. **A build that names both is
# silently a Metal build**, which matters because Cargo unifies features: a
# binary depending on two crates that each want a different backend gets both,
# and now compiles. `Renderer::engine` reports which one is live, and asking it
# is the only way to know.
[features]
# The GPU backend, forwarded through `meo-canvas-core` rather than named
# directly: `meo-skia-canvas` is deliberately absent from this crate's
# dependencies, and a feature that reached past core would put it back.
default = []
metal = ["meo-canvas-core/metal"]
vulkan = ["meo-canvas-core/vulkan"]

[dependencies]
meo-canvas-core = { workspace = true }
meo-canvas-scene = { workspace = true }

# `meo-skia-canvas` and `taffy` are absent on purpose. Both are reachable
# through `meo-canvas-core`, and naming either here would put its types one
# `pub use` away from this crate's surface, which is the way a public API
# acquires a dependency it never meant to promise.

[lints]
workspace = true
