[package]
name = "meo-canvas"
description = "Describe a picture, get image bytes back. CSS flexbox, grid and block layout on a Skia backend."
keywords = ["canvas", "layout", "flexbox", "grid", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# A build naming both `metal` and `vulkan` compiles and is a Metal build:
# meo-skia-canvas gives Metal precedence, the overlap being reachable only on
# macOS. Cargo unifies features, so two dependencies wanting different backends
# get both, and `Canvas::engine` reports which one is live.
[features]
# The GPU backend, forwarded through `meo-canvas-core` rather than named
# directly: `meo-skia-canvas` is deliberately absent from this crate's
# dependencies, and a feature that reached past core would put it back.
default = []
metal = ["meo-canvas-core/metal"]
vulkan = ["meo-canvas-core/vulkan"]

# Fetching an `ImageSource::Url`, forwarded to `meo-canvas-core/net`. Off by
# default: npm ships the client prebuilt, while here the consumer pays in
# dependencies, build time and audit surface, so whoever pays decides. Without
# it a URL is `Error::UnresolvedSource`, whose message names this feature.
net = ["meo-canvas-core/net"]

[dependencies]
meo-canvas-core = { workspace = true }
meo-canvas-scene = { workspace = true }

# `meo-skia-canvas` and `taffy` are absent on purpose. Both are reachable
# through `meo-canvas-core`, and naming either here would put its types one
# `pub use` away from this crate's surface, which is the way a public API
# acquires a dependency it never meant to promise.

[lints]
workspace = true

[dev-dependencies]
# Writes the sources `chrome_object_fit_overflow` renders. Generated rather
# than committed: `cover` needs an aspect that does not match its box and
# `none` needs a source larger than its box, and one asset cannot be both
# without boxes so small the assertion becomes a rounding argument.
png = "0.18.1"
