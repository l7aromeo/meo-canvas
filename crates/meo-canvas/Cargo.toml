[package]
name = "meo-canvas"
description = "Declarative 2D scene rendering on Skia with CSS flexbox, grid and block layout."
keywords = ["canvas", "layout", "flexbox", "grid", "rendering"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# **`metal` and `vulkan` are alternatives; naming both does not build.**
# meo-skia-canvas binds both engines to one `Engine` name, so a build with both
# is `error[E0252]` inside that crate -- l7aromeo/meo-skia-canvas#36, unfixed
# as of 0.12.0. Cargo builds dependencies first, so the error arrives from a
# crate the caller never named and no `compile_error!` here can get in front of
# it; this comment is the earliest place the fact can be read.
#
# **Feature unification makes this worse than a manifest mistake.** A binary
# depending on two crates that each want a different backend gets both, and
# nothing that consumer controls separates them. Only upstream choosing a
# precedence fixes it.
[features]
# The GPU backend, forwarded through `meo-canvas-core` rather than named
# directly: `meo-skia-canvas` is deliberately absent from this crate's
# dependencies, and a feature that reached past core would put it back.
default = []
metal = ["meo-canvas-core/metal"]
vulkan = ["meo-canvas-core/vulkan"]

[dependencies]
meo-canvas-core = { workspace = true }
meo-canvas-scene = { workspace = true }

# `meo-skia-canvas` and `taffy` are absent on purpose. Both are reachable
# through `meo-canvas-core`, and naming either here would put its types one
# `pub use` away from this crate's surface, which is the way a public API
# acquires a dependency it never meant to promise.

[lints]
workspace = true
