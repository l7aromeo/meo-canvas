[package]
name = "meo-canvas-core"
description = "The rendering pipeline behind meo-canvas: resolve, measure, layout, paint and encode a scene."
keywords = ["canvas", "layout", "rendering", "skia", "taffy"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

# Naming both `metal` and `vulkan` builds a Metal binary: meo-skia-canvas gives
# Metal precedence (l7aromeo/meo-skia-canvas#36), and Cargo unifies features, so
# a binary whose dependencies want different backends gets both.
# `Renderer::engine` reports which one is live.
[features]
# The GPU backend, named by the platform that has one: Metal on Apple targets,
# Vulkan elsewhere. Forwarded to `meo-skia-canvas`, which compiles it: this
# crate is a Rust consumer's only path to it. Neither is default, so a build
# naming none renders on the CPU, as a portable `cargo check` needs.
default = []
metal = ["meo-skia-canvas/metal"]
vulkan = ["meo-skia-canvas/vulkan"]

# Fetching an `ImageSource::Url` over a blocking client, off by default so a
# consumer who never names a URL links no HTTP stack; off, a `Url` is refused.
# Fixed bounds, 5 s to connect and 60 s and 32 MiB per image, are argued on
# `resolve`'s constants; a caller wanting others passes `ImageSource::Bytes`.
net = ["dep:ureq", "dep:rustls"]

[dependencies]
base64 = { workspace = true }
csscolorparser = { workspace = true }
meo-canvas-scene = { workspace = true }
meo-skia-canvas = { workspace = true }
taffy = { workspace = true }
thiserror = { workspace = true }

# No async runtime: one here would be one in every Rust consumer of
# `meo-canvas`, including those already inside one. `ureq` is blocking and sits
# behind `net`; `cargo tree -e normal --features net` names no `tokio`,
# `futures`, `async`, `mio` or `smol`.
ureq = { workspace = true, optional = true }
# Declared to raise a floor, never imported: `ureq` speaks TLS through `rustls`
# and requires `^0.23`, which a consumer can resolve below `0.23.45`, the fix
# for `RUSTSEC-2026-0285`. Retires when `ureq` itself requires `0.23.45` or
# newer.
rustls = { workspace = true, optional = true }

[[bench]]
name = "render"
harness = false

[lints]
workspace = true

# `rustls` is never imported, so cargo-machete would report it. `taffy` needs
# no entry: with it removed, cargo-machete finds `taffy` used and reports
# nothing.
[package.metadata.cargo-machete]
ignored = ["taffy", "rustls"]

[dev-dependencies]
# Decoders, not encoders: an encode test asserting on byte length proves
# nothing, so these read the output back and count what is in it.
# cargo-machete reads this section too, so a decoder no test calls is reported.
gif = "0.14.2"
# The bench's harness. A dev-dependency because a bench is not shipped, and
# `harness = false` above because criterion supplies its own.
criterion = { workspace = true }
png = "0.18.1"
