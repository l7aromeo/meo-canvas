[package]
name = "meo-canvas-core"
description = "The rendering pipeline behind meo-canvas: resolve, measure, layout, paint and encode a scene."
keywords = ["canvas", "layout", "rendering", "skia", "taffy"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# The GPU backend, chosen at build time and named by the platform that has one:
# Metal on Apple targets, Vulkan elsewhere. Forwarded rather than declared --
# `meo-skia-canvas` is what compiles a backend, and this crate is the only path
# a Rust consumer has to it.
#
# Neither is default: a build with no backend named renders on the CPU, which is
# what a portable `cargo check` needs. That default is also why the two example
# surfaces silently disagreed -- the addon named a backend and no Rust caller
# could, so one rendered on the GPU and the other on the CPU while both reported
# `gpu: true`.
default = []
metal = ["meo-skia-canvas/metal"]
vulkan = ["meo-skia-canvas/vulkan"]

# Fetching an `ImageSource::Url`, off unless a consumer asks.
#
# **Off by default because the cost is not the code, it is the dependency.** A
# consumer who never names a URL should not link an HTTP stack, and with this
# off the `Url` arm is the refusal it has always been -- so the failure is
# identical to the one the TypeScript surface gives before it fetches, and the
# difference between the two builds is a flag rather than a capability gap.
#
# The client is blocking, which is the part that matters: see the note beside
# `ureq` below for what this crate promised and what changed.
net = ["dep:ureq"]

[dependencies]
csscolorparser = { workspace = true }
meo-canvas-scene = { workspace = true }
meo-skia-canvas = { workspace = true }
taffy = { workspace = true }
thiserror = { workspace = true }

# No tokio, no smol, no async of any kind. **That half stands and is the half
# that was load-bearing**: a runtime in this crate would be a runtime in every
# Rust consumer of the public `meo-canvas` crate, including those already
# inside one, and `ureq` is blocking by construction.
#
# **The other half of what this comment used to say -- "and no HTTP client" --
# is no longer true, and it is recorded here rather than deleted.** The user
# approved fetching on the JavaScript surface and then asked whether the Rust
# side would fetch too. That was a question, not an instruction: the ruling in
# answer to it was that the core gains an HTTP client behind a default-off
# feature, because a Rust surface that cannot do what the JavaScript one does is
# the asymmetry the fetching decision existed to avoid. So the promise that
# changed was about the dependency, not about the runtime, and a consumer who
# does not enable `net` still gets exactly the crate the old comment described.
#
# Audited rather than assumed, because the workspace note beside `ureq` lists a
# smaller tree than the one it actually pulls: `cargo tree -e normal` under the
# feature also brings `rustls`, `ring`, `flate2`, `once_cell`, `subtle`,
# `zeroize` and `untrusted`. Grepped for `tokio`, `futures`, `async`, `mio` and
# `smol` across the whole tree and it is clean -- **no runtime anywhere, which
# is the claim, and it is bigger than the note suggests, which is not.**
ureq = { workspace = true, optional = true }

[[bench]]
name = "render"
harness = false

[lints]
workspace = true

# `taffy` alone, and only until `layout` imports it. `meo-skia-canvas` came off
# this list when `resolve` and `measure` began using it, which is the rule: an
# entry here is a pass not yet written, and an entry still here when the crate
# is finished is a dependency to delete.
[package.metadata.cargo-machete]
ignored = ["taffy"]

[dev-dependencies]
# Decoders, not encoders: an encode test that asserts on byte length proves
# nothing -- a one-frame GIF and a three-frame GIF are both "some bytes". These
# read the output back and count what is in it.
#
# `cargo-machete` reads this section too, so a decoder no test calls is reported
# rather than left to accumulate.
gif = "0.14.2"
# The bench's harness. A dev-dependency because a bench is not shipped, and
# `harness = false` above because criterion supplies its own.
criterion = { workspace = true }
png = "0.18.1"
