[package]
name = "meo-canvas-core"
description = "The rendering pipeline behind meo-canvas: resolve, measure, layout, paint and encode a scene."
keywords = ["canvas", "layout", "rendering", "skia", "taffy"]
categories = ["graphics", "rendering", "multimedia::images"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
meo-canvas-scene = { workspace = true }
meo-skia-canvas = { workspace = true }
taffy = { workspace = true }
thiserror = { workspace = true }

# No tokio, no smol, no async of any kind, and no HTTP client. The pipeline is a
# function from bytes to bytes: a caller who wants a remote image resolves it
# before calling, and the CLI's `net` feature is where a fetcher lives. A
# runtime in this crate would be a runtime in every Rust consumer of the public
# `meo-canvas` crate, including those already inside one.

[lints]
workspace = true

# `taffy` alone, and only until `layout` imports it. `meo-skia-canvas` came off
# this list when `resolve` and `measure` began using it, which is the rule: an
# entry here is a pass not yet written, and an entry still here when the crate
# is finished is a dependency to delete.
[package.metadata.cargo-machete]
ignored = ["taffy"]

[dev-dependencies]
# Decoders, not encoders: an encode test that asserts on byte length proves
# nothing -- a one-frame GIF and a three-frame GIF are both "some bytes". These
# read the output back and count what is in it.
#
# `cargo-machete` reads this section too, so a decoder no test calls is reported
# rather than left to accumulate.
gif = "0.14.2"
png = "0.18.1"
