[package]
name = "meo-canvas-cli"
description = "Command-line renderer for meo-canvas scene files."
keywords = ["canvas", "cli", "rendering", "layout", "graphics"]
categories = ["command-line-utilities", "graphics", "rendering"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "meo-canvas"
path = "src/main.rs"
# The binary shares a name with the library crate, so both would write
# `target/doc/meo_canvas/index.html` and cargo reports a filename collision. The
# library's documentation is the one that gets published; the binary's interface
# is `--help`.
doc = false

[features]
# Fetching an `ImageSource::Url`, forwarded to `meo-canvas-core/net`, where the
# fetch lives. Off by default: a renderer that reaches the network on an input
# file's say-so should be a build someone chose. Without it a URL exits 6 and
# the message names this feature.
default = []
net = ["meo-canvas-core/net"]

[dependencies]
meo-canvas-core = { workspace = true }
meo-canvas-scene = { workspace = true }
clap = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
# Decodes what the binary wrote. A file that exists proves nothing -- a
# zero-byte one exists too -- so the spawn tests read the output back and check
# its dimensions.
png = "0.18.1"
