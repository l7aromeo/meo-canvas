[workspace]
# Edition 2024's resolver, stated rather than inherited: a virtual manifest has
# no `edition` of its own to infer it from, so leaving this out silently picks
# resolver 2 for the whole graph.
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.4"
edition = "2024"
# The floor the workspace needs; a lower number would be a claim no CI job
# checks.
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/l7aromeo/meo-canvas"
homepage = "https://l7aromeo.github.io/meo-canvas/"
authors = ["L A Romeo <ukasyahrz@outlook.com>"]
# `readme` is not inherited: an inherited path resolves against the workspace
# root, so every member would advertise the same file.

[workspace.dependencies]
# Both `path` and `version`: a published member carries the version and a
# local build follows the path, so naming one leaves the crate either
# unpublishable or untestable.
meo-canvas-scene = { path = "crates/meo-canvas-scene", version = "0.1.4" }
meo-canvas-core = { path = "crates/meo-canvas-core", version = "0.1.4" }

# No default features: its `node-addon` would add a second `#[neon::main]`, and
# `meo-canvas-node` owns the only one. A floor rather than `0.16`, since a
# consumer never reads our lockfile: older versions misdraw an SVG source
# (`l7aromeo/meo-skia-canvas#212`) and an animated AVIF's colour space.
meo-skia-canvas = { version = "0.16.3", default-features = false }

# `calc` is off: taffy's calc is an opaque handle the caller resolves, not an
# evaluator. It is not what makes `TaffyTree` `!Send`; every length is a tagged
# pointer with or without it. `flexbox_balance` is off because Chrome ships
# neither of the `FlexWrap` values it adds.
taffy = { version = "0.14", default-features = false, features = [
    "flexbox",
    "grid",
    "block_layout",
    "std",
    "taffy_tree",
    "content_size",
] }

# Decodes a `data:` image source. `ureq` already brings it under `net`; naming
# it gives a build without `net` the same decoder rather than a hand-written one.
base64 = "0.23"
# The parser `meo-skia-canvas` uses for its own colour strings, so a colour
# resolved here and one resolved by the backend agree by construction.
csscolorparser = "0.8"

neon = "1.1"
# The addon's asynchronous encodes run here, not on `cx.task`: libuv's pool has
# four threads shared with `fs`, `dns` and `crypto`, so a 130 ms encode there
# moves the stall into `fs.readFile`. Already in the graph through
# `meo-skia-canvas`, so naming it adds an edge rather than a crate.
rayon = "1.11"
clap = { version = "4.6", features = ["derive"] }
# The HTTP client that does not choose the consumer's runtime: no tokio and no
# futures among its required dependencies, where reqwest requires `tokio`,
# `hyper` and `tower` even for its `blocking` feature.
ureq = "3.4"
# A floor, not a use: nothing imports `rustls`, but `ureq`'s `^0.23` admits
# versions with `RUSTSEC-2026-0285`, and only the manifest reaches a consumer.
# Retires when `ureq` itself requires `0.23.45` or newer.
rustls = ">=0.23.45"
thiserror = "2.0"
# Benchmarks are an instrument, not a gate, so none is in the `ci` chain: a
# number that varies with the machine cannot fail a build honestly.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"
missing_crate_level_docs = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# A crate named for its subject repeats that subject in its types. `scene::Scene`
# and `codec::CodecError` are what a caller writes and what the module tree
# already says; renaming them to satisfy the lint costs clarity at the call site.
module_name_repetitions = "allow"
# Layout arithmetic is `f32` throughout because Skia's and taffy's are. Every
# integer-to-float and float-to-integer step here is a conversion between two
# APIs that already disagree, so the casts are the interface, not an oversight.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
# Geometry code names things `x`/`y`, `width`/`height`, `min`/`max` in pairs.
# The lint reads those pairs as typo risk; renaming them to satisfy it makes the
# formulas harder to check against the spec they implement.
similar_names = "allow"
# `#[must_use]` on every getter is noise that trains readers to skip the
# attribute. It stays reserved for returns that are genuinely wasteful to drop.
must_use_candidate = "allow"
# The graph carries duplicate transitive versions the workspace does not choose
# -- `meo-skia-canvas` and `taffy` pin their own. Failing our build over another
# crate's dependency tree is a lint we could never act on.
multiple_crate_versions = "allow"
# `missing_docs = "deny"` covers the public surface; demanding a doc on every
# private three-line helper adds nothing a reader of the file does not see.
missing_docs_in_private_items = "allow"

missing_errors_doc = "warn"
missing_panics_doc = "warn"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "warn"
panic = "warn"
todo = "deny"
dbg_macro = "deny"
print_stdout = "warn"
str_to_string = "warn"
