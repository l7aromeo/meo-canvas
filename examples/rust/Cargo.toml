# Standalone, not a workspace member: a consumer reaches meo-canvas through a
# dependency rather than from inside the tree that builds it. The empty
# `[workspace]` is what keeps cargo from adopting it into the one above.
[workspace]

[package]
name = "meo-canvas-example-card"
version = "0.0.0"
edition = "2024"
publish = false

# The GPU backend this example asks for, forwarded so `just example` can name
# the platform's. Without it the Rust half rasterises on the CPU while the
# JavaScript half uses the GPU, and the two draw the same picture a channel or
# two apart -- which is what the byte comparison in `just example` now catches.
[features]
default = []
metal = ["meo-canvas/metal"]
vulkan = ["meo-canvas/vulkan"]

[dependencies]
meo-canvas = { path = "../../crates/meo-canvas" }
