name: docs

# The JavaScript reference: gated on every pull request, and published once per
# release rather than once per commit.
#
# `latest/` follows the newest stable published release, not `v10`. A reference
# that tracked the branch would describe methods that are not in anyone's
# `node_modules` yet, which is worse than describing none: the reader has no
# way to tell which half of the page they can call. Every release keeps its
# own copy at `vX.Y.Z/`, prereleases included, so a project pinned to any
# version still has its documentation.
#
# Only the JavaScript half is built. TypeDoc reads `dist/*.d.ts` and needs no
# native module, so a build is under a minute; `cargo doc` needs a full Skia
# build, and docs.rs publishes that from the crate's own doc comments, per
# version, for nothing.
#
# Adapted from `meo-skia-canvas/.github/workflows/docs.yml`. Two things differ.
# That project checks its declarations in; this one builds them with `tsc`
# first. And that project's release is created before its package is published,
# so it has to reason about the gap; here `release.yml` creates the GitHub
# release only after `npm publish` has succeeded, and this workflow still
# **waits for the version to resolve from the registry** before deploying,
# because "published" and "installable" are separated by propagation.
run-name: >-
  docs — ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || 'check' }}

on:
  # The GitHub release being published. `release.yml` opens it as the last
  # step after every package is on npm, so this fires after the publish and
  # never before it.
  release:
    types: [published]
  pull_request:
    paths:
      - 'packages/meo-canvas/src/**'
      - 'packages/meo-canvas/tools/typedoc/**'
      - '.github/workflows/docs.yml'
  # Backfills a version published before this workflow existed, or reruns one
  # whose build failed. Publishing an older tag does not move `latest/` unless
  # it really is the newest stable.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v10.0.0-alpha.4'
        required: true
        type: string

permissions:
  contents: read

# **`cancel-in-progress` is conditional here, where `ci.yml` can say `true`
# flatly.** There a superseded run describes code nobody has any more, so
# cancelling it is free. Here half the triggers deploy: cancelling one of those
# mid-flight can leave `gh-pages` pushed and the Pages artifact never uploaded,
# and two publishes running at once race the same non-force push from two
# shallow clones with no retry between them.
#
# So pull requests keep the cheap behaviour, grouped by ref and cancelling
# their own supersedes, and every publishing path shares one group that queues
# instead. Queueing costs a few minutes; cancelling costs a site that disagrees
# with itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: reference (typedoc)
    runs-on: ubuntu-latest
    # A minute is what this takes; the bound is on a hung install or a TypeDoc
    # that never returns, not on the work.
    timeout-minutes: 20
    outputs:
      version: ${{ steps.which.outputs.version }}
    steps:
      # Which version, if any, this run publishes. A pull request builds and
      # gates but publishes nothing.
      - id: which
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            release)           TAG="${{ github.event.release.tag_name }}" ;;
            *)                 TAG="" ;;
          esac
          # `v10.0.0` or `v10.0.0-alpha.4`; the crates lineage is `crates-v*`
          # and does not create a JavaScript reference.
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::'$TAG' is not an npm release tag (expected vX.Y.Z or vX.Y.Z-pre)"
              exit 1
            fi
            echo "::notice::$TAG is not an npm release tag; nothing published"
            TAG=""
          fi
          echo "version=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.which.outputs.version }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd packages/meo-canvas/tools/typedoc --frozen-lockfile

      # The declarations are built, not committed: `tsc` on the package's build
      # config emits `dist/*.d.ts`, which is what the package ships as `types`
      # and what TypeDoc reads. No native module is involved.
      - name: Build the declarations
        run: ./node_modules/.bin/tsc -p packages/meo-canvas/tsconfig.build.json

      # Structural findings fail; the undocumented count may not rise. See
      # `tools/typedoc/build.mjs`.
      - name: Build the reference
        run: node packages/meo-canvas/tools/typedoc/build.mjs

      # `build.mjs` lowers the baseline when the count falls. On a pull request
      # that must be committed with the change, not discovered here.
      - name: Check the baseline did not move
        run: git diff --exit-code packages/meo-canvas/tools/typedoc/undocumented-baseline.txt

      - name: Keep the reference
        if: steps.which.outputs.version != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference
          path: target/jsdoc
          # **The action's default is `warn`, and `warn` is wrong here.** This
          # step runs only when a version is being published, so no pull
          # request ever exercises it -- and with the default, a `target/jsdoc`
          # that came out empty or moved would upload nothing, `publish` would
          # download nothing, and `cp -r incoming site/${VERSION}` would deploy
          # an empty reference from a run that was green throughout. The one
          # path that can fail is the one no rehearsal covers.
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ needs.build.outputs.version }}
    needs: build
    if: needs.build.outputs.version != ''
    runs-on: ubuntu-latest
    # Ten of these are the registry wait below, which fails on its own deadline
    # and reports why. The rest is headroom for the deploy, and a bound on the
    # case that deadline cannot see: an environment approval nobody grants,
    # which would otherwise hold a runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # **Installable, not merely published.** The release event fires after
      # `npm publish` returned, and the registry can still take a minute to
      # serve the version. Deploying `latest/` for a version `npm install`
      # cannot yet give you is the confusion this whole arrangement exists to
      # prevent, so this waits for the registry to answer -- bounded, and loud
      # when the bound is hit, because a version that never appears is a
      # release that did not happen.
      - name: Wait for the release to be installable, not merely published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          want="${VERSION#v}"

          # One deadline for the whole question rather than one per package.
          # Ten minutes is the budget for "this release is installable"; a
          # per-package budget would multiply by eight and turn one stuck
          # registry entry into an eighty-minute job.
          deadline=$(( $(date +%s) + 600 ))
          resolves() {
            until npm view "$1" version >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$1 did not resolve from npm within ten minutes; not publishing a reference for a version nobody can install"
                exit 1
              fi
              echo "  waiting for $1"
              sleep 15
            done
            echo "  $1 resolves"
          }

          resolves "meo-canvas@${want}"

          # **The main package alone was never the question this step claimed
          # to answer.** It said it was waiting so that `latest/` never
          # describes a version `npm install` cannot give you -- and an install
          # of `meo-canvas` also resolves the seven platform packages its
          # `optionalDependencies` names. Checking one of eight was a green
          # check for a claim eight times wider.
          #
          # **They are optional, which is what makes this necessary rather than
          # tidy.** npm does not fail an install when it cannot resolve an
          # `optionalDependencies` entry: it warns, succeeds, and leaves an
          # installation with no addon that throws on the first render. So the
          # failure this prevents does not look like a broken release. It looks
          # like a broken library.
          #
          # **Read out of the published manifest rather than listed here.**
          # Asking npm what that version declares is asking the question the
          # claim is about; a list in this file would be a second place to keep
          # in step with `packages/meo-canvas/package.json`, and reading the
          # checkout would be wrong for a `workflow_dispatch` backfill, whose
          # `repo/` is a branch rather than the tag being published.
          #
          # `jq` rather than `node`, for the reason `crates-io.yml` gives at its
          # own version read: `npm` is on the image and this step already rests
          # on that, but nothing here sets a Node up on purpose.
          declared=$(npm view "meo-canvas@${want}" optionalDependencies --json)
          test -n "$declared" || declared='{}'
          platforms=$(printf '%s' "$declared" | jq -r 'to_entries[] | "\(.key)@\(.value)"')

          # **Zero is a failed read, not an empty set.** Every 10.x ships seven
          # platform packages, so no entries means the manifest did not parse
          # or npm answered with nothing -- which is exactly the shape that
          # would let this step pass having checked nothing, which is what it
          # was doing before. A version that genuinely ships no platform
          # package will have to change this line, and should have to.
          count=$(printf '%s' "$platforms" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::meo-canvas@${want} declared no optionalDependencies; this check looked at nothing"
            exit 1
          fi
          echo "waiting on ${count} platform packages"

          for spec in $platforms; do
            resolves "$spec"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference
          path: incoming

      # The site accumulates on `gh-pages`: every published version, and the
      # index over them. Fetched shallow because only the newest state matters
      # and the history is one commit per release anyway.
      - name: Fetch the store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth=1 origin gh-pages; then
            git checkout -q -B gh-pages FETCH_HEAD
            echo "store: $(git rev-parse --short HEAD)"
          else
            git checkout -q -B gh-pages
            echo "store: empty, first publish"
          fi

      # **`latest/` is the newest stable version, or it does not exist.** It
      # used to fall back to the newest prerelease when no stable version had
      # been published, which is where it stands today and will until 10.0.0.
      # That fallback is gone: `latest/` meaning "the newest thing we have" is
      # a different promise from `npm install meo-canvas`, and a reader who
      # follows the link has no way to tell which promise they got. While no
      # stable version exists there is no `latest/` at all, and
      # `site-index.mjs` says so and links the newest prerelease by its own
      # version instead.
      #
      # **Chosen here, and not by `site-index.mjs`.** This comment used to
      # credit the script, which does not decide: the sort below picks the
      # stable version, stamps it into `latest/VERSION`, and `site-index.mjs`
      # reads that stamp. It has no fallback of its own any more either -- an
      # absent stamp means an absent `latest/`, which is what not writing one
      # means here -- and it refuses outright if the stamp ever names a
      # prerelease. Two files still implement one rule; the second now fails
      # loudly rather than papering over the first.
      #
      # The brand images come from the repository checkout because the site is
      # assembled from two sources and they live in neither the reference nor
      # the store. They are what the library drew of itself -- see
      # `docs/assets/brand/README.md` -- and the landing page is the one place
      # a stranger judges this project by a picture.
      - name: Assemble the site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          touch site/.nojekyll
          rm -rf "site/${VERSION}"
          cp -r incoming "site/${VERSION}"

          mkdir -p site/assets/brand
          cp repo/docs/assets/brand/banner-dark.webp \
             repo/docs/assets/brand/banner-light.webp \
             repo/docs/assets/brand/banner.webp \
             repo/docs/assets/brand/banner.png \
             site/assets/brand/

          # Stable only. An empty answer is the no-stable state and not a
          # failure, so this reads it into a variable rather than letting a
          # `set -e` pipeline decide.
          newest_stable=$(node -e "
            const { readdirSync } = require('node:fs')
            const parse = n => { const m = /^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(n); return m && { v: [+m[1], +m[2], +m[3]], pre: m[4] ?? null } }
            const stable = readdirSync('site', { withFileTypes: true }).filter(e => e.isDirectory() && parse(e.name) && parse(e.name).pre === null).map(e => e.name)
            stable.sort((a, b) => { const x = parse(a), y = parse(b); for (let i = 0; i < 3; i++) if (x.v[i] !== y.v[i]) return y.v[i] - x.v[i]; return 0 })
            process.stdout.write(stable[0] ?? '')
          ")

          rm -rf site/latest
          if [ -n "$newest_stable" ]; then
            echo "latest/ follows ${newest_stable}"
            cp -r "site/${newest_stable}" site/latest
            printf '%s\n' "${newest_stable}" > site/latest/VERSION
          else
            echo "no stable release is published, so no latest/ is written; the index says so"
          fi

          node repo/packages/meo-canvas/tools/typedoc/site-index.mjs site

      - name: Record it
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -q -m "docs: ${VERSION}"
          git push -q origin HEAD:gh-pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
