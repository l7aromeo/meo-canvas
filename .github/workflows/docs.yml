name: docs

# The JavaScript reference: gated on pull requests, published per release.
# `latest/` follows the newest stable release and each release keeps its own
# `vX.Y.Z/`. Only the JavaScript half, since docs.rs builds the Rust one. Waits
# for the version to resolve from npm before deploying.
run-name: >-
  docs — ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || 'check' }}

on:
  # A GitHub release being published by hand. `release.yml` opens its release
  # with `GITHUB_TOKEN`, which starts no workflow, so it dispatches this at the
  # tag instead.
  release:
    types: [published]
  # Every input to `tsc -p packages/meo-canvas/tsconfig.build.json` and the
  # TypeDoc tool, and nothing else. A path filter cannot see a dependency
  # shipping different types under a pinned version; the release path covers
  # that by rebuilding from the tag.
  pull_request:
    paths:
      # What is compiled.
      - 'packages/meo-canvas/src/**'
      # The config `tsc` is invoked with, and the base it extends. Either can
      # turn declaration emit off, move `rootDir`, or drop a strictness flag
      # the surface was written against.
      - 'packages/meo-canvas/tsconfig.build.json'
      - 'packages/meo-canvas/tsconfig.json'
      # `moduleResolution: nodenext` reads this package's `type` and `exports`
      # to resolve anything, and its `@types/node` dependency is what
      # `"types": ["node"]` in the base config resolves to -- so a bump here
      # changes what the declarations say.
      - 'packages/meo-canvas/package.json'
      # `typedoc.json` names this as the reference's front page, so a change to
      # it is a change to the published site.
      - 'packages/meo-canvas/README.md'
      # The tool: `build.mjs`, `typedoc.json`, its own manifest and lockfile,
      # and the undocumented baseline the build refuses to let rise.
      - 'packages/meo-canvas/tools/typedoc/**'
      # The workflow installs from the repository root, and the root lockfile
      # is what pins the compiler that emits the declarations -- TypeScript is
      # a root dependency, and `./node_modules/.bin/tsc` is the one that runs.
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docs.yml'
  # Backfills a version published before this workflow existed, or reruns one
  # whose build failed. Publishing an older tag does not move `latest/` unless
  # it really is the newest stable.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. npm-v10.0.0-alpha.6'
        required: true
        type: string

permissions:
  contents: read

# Pull requests cancel their own superseded runs, as in `ci.yml`. Publishing
# paths share one group and queue: cancelling mid-deploy can push `gh-pages`
# without uploading the Pages artifact, and two concurrent publishes race one
# non-force push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: reference (typedoc)
    runs-on: ubuntu-latest
    # A minute is what this takes; the bound is on a hung install or a TypeDoc
    # that never returns, not on the work.
    timeout-minutes: 20
    outputs:
      # The tag names the ref and the release; the version names the package
      # and the directory. Nothing downstream derives one from the other.
      tag: ${{ steps.which.outputs.tag }}
      version: ${{ steps.which.outputs.version }}
    steps:
      # Which version, if any, this run publishes. A pull request builds and
      # gates but publishes nothing.
      - id: which
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch) TAG="${{ inputs.tag }}" ;;
            release)           TAG="${{ github.event.release.tag_name }}" ;;
            *)                 TAG="" ;;
          esac
          # `npm-vX.Y.Z[-pre]`, or the unprefixed `vX.Y.Z` of the 68 older npm
          # tags, which `workflow_dispatch` backfills. `rust-v*` has no
          # JavaScript reference and must not match. `tools/release-tags.mjs`
          # runs a tag of each shape through this exact line.
          if [ -n "$TAG" ] && ! printf '%s' "$TAG" | grep -Eq '^(npm-)?v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::'$TAG' is not an npm release tag (expected npm-vX.Y.Z, npm-vX.Y.Z-pre, or the pre-rename vX.Y.Z)"
              exit 1
            fi
            echo "::notice::$TAG is not an npm release tag; nothing published"
            TAG=""
          fi
          # The one place a tag becomes a version: `npm-v10.0.0` and `v10.0.0`
          # both give `10.0.0`. `npm view` answers E404 for a tag spelling,
          # spending the registry wait's whole deadline.
          # `tools/release-tags.mjs` checks these two lines over each tag shape.
          VERSION="${TAG#npm-}"
          VERSION="${VERSION#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.which.outputs.tag }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      - name: Install
        run: |
          bun install --frozen-lockfile
          bun install --cwd packages/meo-canvas/tools/typedoc --frozen-lockfile

      # The declarations are built, not committed: `tsc` on the package's build
      # config emits `dist/*.d.ts`, which is what the package ships as `types`
      # and what TypeDoc reads. No native module is involved.
      - name: Build the declarations
        run: ./node_modules/.bin/tsc -p packages/meo-canvas/tsconfig.build.json

      # Structural findings fail; the undocumented count may not rise. See
      # `tools/typedoc/build.mjs`.
      - name: Build the reference
        run: node packages/meo-canvas/tools/typedoc/build.mjs

      # `build.mjs` lowers the baseline when the count falls. On a pull request
      # that must be committed with the change, not discovered here.
      - name: Check the baseline did not move
        run: git diff --exit-code packages/meo-canvas/tools/typedoc/undocumented-baseline.txt

      - name: Keep the reference
        if: steps.which.outputs.tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference
          path: target/jsdoc
          # `error`, not the default `warn`: only a publish runs this step, so
          # an empty `target/jsdoc` would otherwise deploy an empty reference
          # from a green run no pull request rehearses.
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish ${{ needs.build.outputs.tag }}
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    # Ten of these are the registry wait below, which fails on its own deadline
    # and reports why. The rest is headroom for the deploy, and a bound on the
    # case that deadline cannot see: an environment approval nobody grants,
    # which would otherwise hold a runner for six hours.
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Installable, not merely published: the registry can take minutes to
      # serve a version after `npm publish` returns. Bounded, and loud at the
      # bound, since a version that never appears is a release that did not
      # happen.
      - name: Wait for the release to be installable, not merely published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail

          # One deadline for the whole question rather than one per package.
          # Ten minutes is the budget for "this release is installable"; a
          # per-package budget would multiply by eight and turn one stuck
          # registry entry into an eighty-minute job.
          deadline=$(( $(date +%s) + 600 ))
          resolves() {
            until npm view "$1" version >/dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "::error::$1 did not resolve from npm within ten minutes; not publishing a reference for a version nobody can install"
                exit 1
              fi
              echo "  waiting for $1"
              sleep 15
            done
            echo "  $1 resolves"
          }

          resolves "meo-canvas@${VERSION}"

          # All seven platform packages too: npm installs past an unresolvable
          # optional dependency with a warning, leaving no addon. Read from the
          # published manifest, not a list here or the checkout, which a
          # backfill takes from a branch. `jq`, since nothing here sets up Node.
          declared=$(npm view "meo-canvas@${VERSION}" optionalDependencies --json)
          test -n "$declared" || declared='{}'
          platforms=$(printf '%s' "$declared" | jq -r 'to_entries[] | "\(.key)@\(.value)"')

          # Zero entries is a failed read, not an empty set: every 10.x ships
          # seven platform packages. A version that ships none has to change
          # this line.
          count=$(printf '%s' "$platforms" | grep -c . || true)
          if [ "$count" -eq 0 ]; then
            echo "::error::meo-canvas@${VERSION} declared no optionalDependencies; this check looked at nothing"
            exit 1
          fi
          echo "waiting on ${count} platform packages"

          for spec in $platforms; do
            resolves "$spec"
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repo

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reference
          path: incoming

      # The site accumulates on `gh-pages`: every published version, and the
      # index over them. Fetched shallow because only the newest state matters
      # and the history is one commit per release anyway.
      - name: Fetch the store
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q site
          cd site
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}"
          if git fetch -q --depth=1 origin gh-pages; then
            git checkout -q -B gh-pages FETCH_HEAD
            echo "store: $(git rev-parse --short HEAD)"
          else
            git checkout -q -B gh-pages
            echo "store: empty, first publish"
          fi

      # `latest/` is the newest stable version, or absent, never a prerelease.
      # The sort below picks it and stamps `latest/VERSION`; `site-index.mjs`
      # reads the stamp and refuses a prerelease. Brand images come from the
      # checkout; see `docs/assets/brand/README.md`.
      - name: Assemble the site
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          touch site/.nojekyll

          # The directory is the version without its channel prefix: the sort
          # below and `site-index.mjs` parse names as `^v(\d+)\.(\d+)\.(\d+)`,
          # so `npm-v...` would deploy unlisted and never advance `latest/`.
          # `rust-v*` never reaches this; docs.rs publishes that reference.
          dir="v${VERSION}"
          rm -rf "site/${dir}"
          cp -r incoming "site/${dir}"

          mkdir -p site/assets/brand
          cp repo/docs/assets/brand/banner-dark.webp \
             repo/docs/assets/brand/banner-light.webp \
             repo/docs/assets/brand/banner.webp \
             repo/docs/assets/brand/banner.png \
             site/assets/brand/

          # Stable only. An empty answer is the no-stable state and not a
          # failure, so this reads it into a variable rather than letting a
          # `set -e` pipeline decide.
          newest_stable=$(node -e "
            const { readdirSync } = require('node:fs')
            const parse = n => { const m = /^v(\d+)\.(\d+)\.(\d+)(?:-([0-9A-Za-z.-]+))?$/.exec(n); return m && { v: [+m[1], +m[2], +m[3]], pre: m[4] ?? null } }
            const stable = readdirSync('site', { withFileTypes: true }).filter(e => e.isDirectory() && parse(e.name) && parse(e.name).pre === null).map(e => e.name)
            stable.sort((a, b) => { const x = parse(a), y = parse(b); for (let i = 0; i < 3; i++) if (x.v[i] !== y.v[i]) return y.v[i] - x.v[i]; return 0 })
            process.stdout.write(stable[0] ?? '')
          ")

          rm -rf site/latest
          if [ -n "$newest_stable" ]; then
            echo "latest/ follows ${newest_stable}"
            cp -r "site/${newest_stable}" site/latest
            printf '%s\n' "${newest_stable}" > site/latest/VERSION
          else
            echo "no stable release is published, so no latest/ is written; the index says so"
          fi

          node repo/packages/meo-canvas/tools/typedoc/site-index.mjs site

      - name: Record it
        env:
          # The tag, because this line is the only record on `gh-pages` of
          # which release a deploy came from, and the tag is what the GitHub
          # release and `git tag` both name. The directory beside it already
          # carries the version.
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          set -euo pipefail
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -q -m "docs: ${TAG}"
          git push -q origin HEAD:gh-pages

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
