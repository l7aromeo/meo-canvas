name: Release

# Ported from the `release` stage of .gitlab-ci.yml.
#
# Publishing is OIDC, as it was on GitLab — no npm token lives here. GitLab
# declared it with `id_tokens: NPM_ID_TOKEN`; on GitHub the equivalent is the
# `id-token: write` permission below, and the trusted publisher registered on
# npmjs.com has to name *this* repository and *this* workflow file. That
# registration does not carry over from GitLab: it is issuer-specific, so it
# must be recreated before the first release here, or the publish step fails
# after semantic-release has already tagged.
# `beta` and `alpha` were configured as prerelease channels and never used as
# ones. `beta` fell 69 commits behind `main` while npm's `beta` dist-tag stayed
# on 5.0.0-beta.5 — three majors old — so anyone installing `meo-canvas@beta`
# got that, and any push to the branch would have released from that stale base.
# Retired rather than repaired: nothing was shipping through them.
on:
  push:
    branches: [main]

# `resource_group: meonode_canvas_pipeline_lock` on GitLab. Two releases must
# never overlap: both would read the same last tag and compute the same next
# version, and the loser publishes into a version that already exists.
# cancel-in-progress stays false — a release half-way through is not something
# to interrupt.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create tags and GitHub releases
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs
  id-token: write # npm trusted publishing

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Whether a release was actually cut. A merge carrying only `chore:` or `test:` commits releases
    # nothing, and the docs job below has no reason to rebuild the site for it.
    outputs:
      published: ${{ steps.semantic.outputs.published }}
    # Capitalised to match the environment that exists on the repository, and
    # the name registered with npm's trusted publisher. The OIDC token carries
    # this string; npm compares it literally, so a case difference here is a
    # failed exchange rather than a warning.
    environment: Production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # semantic-release derives the next version from the tags reachable
          # on this branch, so a shallow clone makes it think nothing has ever
          # been released and start again from 1.0.0.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The npm bundled with Node 22 predates trusted publishing, in which case
      # publishing falls back to looking for a token and fails.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        env:
          HUSKY: 0
        run: bun install --frozen-lockfile
      - run: bun run build
      # Before the publish, not after. The docs job below runs once semantic-release has already put
      # the package on npm, so a reference that will not build cannot stop the release by then --
      # 9.0.0 went out that way. Building it here fails the job while the version is still uncut.
      - run: bun run docs
      # `successCmd` in .releaserc.json sets the `published` output the docs job reads. It cannot use
      # `${...}`: @semantic-release/exec runs every command through a lodash template first, which
      # treats that as an interpolation and tries to evaluate it as JavaScript. `${GITHUB_OUTPUT:-…}`
      # failed 8.0.0's release that way, after the publish had already gone out.
      - name: semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun x semantic-release

  # The API reference documents released versions, so it is rebuilt here rather than on a push to
  # main. Calling the workflow is what makes this run at all: semantic-release publishes the release
  # with GITHUB_TOKEN, and events raised by that token do not start workflows of their own.
  docs:
    name: publish the API reference
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
