name: release

# A dry run and a real publish look identical in the Actions list unless the run
# says which it is.
run-name: >-
  ${{ inputs.dry_run && 'release — DRY RUN (nothing is published)' || 'release — publish' }}

# Manual only. Nothing publishes on a push, because a push is how code arrives
# and publishing is a decision about code that already arrived. `just release`
# is what a person runs; this is what it triggers.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack every target, validate the publish, but do not publish'
        type: boolean
        default: true

# Read by default; `publish` alone widens it, with `id-token: write` for npm
# provenance from the workflow's identity and `contents: write` to tag and
# release. A token the build jobs could mint would let seven machines compiling
# third-party code speak as this repository.
permissions:
  contents: read

# One release at a time, never cancelled. The group omits the ref, since
# dispatches at `main` and at a tag publish the same version and push the same
# `npm-v<version>` tag. The publish job is not idempotent midway; a queued
# second dispatch walks past what the first published.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every `run:` here is bash, and Windows defaults to PowerShell. Set for the
# whole workflow, since the next Windows failure would be the next bash step
# anyone writes.
defaults:
  run:
    shell: bash

jobs:
  # Read from `TARGETS` in `tools/stage-platform-package.mjs`, so a target added
  # there builds without editing this file. `src/addon.test.ts` asserts that
  # list against the other two places a target is named; this consumer is
  # outside any unit test.
  targets:
    name: targets
    runs-on: ubuntu-latest
    # A checkout, a Node install and one `node -p`. Ten minutes is not a budget
    # for that -- it is a bound on a checkout or an action download that has
    # stopped rather than slowed, which without it holds a runner for GitHub's
    # six-hour default.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      name: ${{ steps.read.outputs.name }}
      prefix: ${{ steps.read.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Read the targets, the version and the dist-tag
        id: read
        run: |
          echo "matrix=$(node packages/meo-canvas/tools/stage-platform-package.mjs --matrix)" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./packages/meo-canvas/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The package name, and the prefix `npm pack` names its file with:
          # `@scope/thing` packs as `scope-thing-1.0.0.tgz`. Derived, since
          # written copies go stale on a rename and every glob below would match
          # nothing.
          name=$(node -p "require('./packages/meo-canvas/package.json').name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=$(node -p "require('./packages/meo-canvas/package.json').name.replace(/^@/, '').replace('/', '-')")" >> "$GITHUB_OUTPUT"
          # A version carrying a prerelease part goes to `next`, never to
          # `latest`. This is what makes an alpha safe to cut: `npm install`
          # resolves `latest`, and a semver range never matches a prerelease,
          # so nobody reaches it without asking for it by name.
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version to dist-tag $tag"

  # One runner per target, each building only its own binary. Cross-compiling
  # Skia is a different problem from building it, and a runner per target buys
  # the answer without solving it.
  build:
    name: build ${{ matrix.suffix }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    # Legs run from 54s to 36m48s, the slow ones compiling Skia in a container,
    # and the bound is per leg. 36m48s was a cold cache; caches expire between
    # releases, so no warm musl leg is ever seen. Ninety, as `ci.yml`: a
    # hang-breaker, so nearing it is a reason to look, not to raise it.
    timeout-minutes: 90
    strategy:
      # Every target reports. Cancelling the set on one failure hides whether
      # the fault is one platform or the code.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      # A block scalar for the quoting: on one line `cut -d'\"'` keeps YAML's
      # backslash and hands `cut` a two-character delimiter, which wrote nothing
      # and failed three steps later.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "toolchain $channel"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Restores and never saves. Two dispatches at one commit on 10 September
      # gained on six of seven legs (6285s to 4777s), but these entries were
      # 5.09 GiB, more than the CI working set they evicted. Sharing CI's cache
      # needs `add-job-id-key: false` in both files.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.suffix }}
          cache-bin: true
          save-if: false

      # No system libraries for Linux: `containers/Dockerfile.{glibc,musl}`
      # carry them and link freetype and fontconfig statically. The Rust
      # toolchain stays for macOS and Windows, and because `rust-cache` fills
      # `~/.cargo/registry`, which `addon-container` mounts.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # bun installs the packages; `just pack` builds `dist` with tsc from them.
      # `npm pack` and `npm publish` stay npm further down: the tarball naming
      # `release.yml` derives its globs from is npm's, and provenance is npm's.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'
      - name: Install the JavaScript dependencies
        run: bun install --frozen-lockfile

      # `just pack` builds the release addon, builds `dist`, stages the platform
      # package for this host and packs both tarballs. The same recipe a person
      # runs locally, so a release cannot take a path nobody has walked.
      - name: Build and pack
        if: runner.os != 'Linux'
        run: just pack

      # Linux builds in a container: on `ubuntu-latest` the addon needs glibc
      # 2.35 and loads on one of six claimed images, in
      # `containers/Dockerfile.glibc` 2.28 and all six. The suffix is passed,
      # since this runner's `--host` answers `linux-x64-gnu` for musl too.
      - name: Build in the release image and pack
        if: runner.os == 'Linux'
        run: just pack-container ${{ matrix.suffix }}

      # What the binary must find at load, printed for a reader; the next step
      # asserts the floors, so they are not printed twice. A binary that cannot
      # be parsed says so loudly, since "nothing needed" and "nothing read"
      # print alike.
      - name: Say what the Linux binary must find
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The path `just addon-container` writes, which is per target and
          # deliberately not the native addon's. See `container_addon` in the
          # justfile: a cross-build that overwrote `addon_path` disarmed every
          # local check needing the native binary.
          SO="target/container/${{ matrix.suffix }}/meo-canvas.node"
          # Single quotes around the message on purpose: backticks inside a
          # double-quoted shell string are command substitution, and this one
          # would have run `just pack` a second time to build its own error.
          test -f "$SO" || { echo '::error::the addon is not where the pack step leaves it'; exit 1; }

          # Read and checked BEFORE the summary block, not inside it. A `{ ... }
          # group on the left of a pipe is a subshell, so an `exit 1` in there
          # ends the subshell and leaves the pipeline reporting `tee`'s success
          # -- a step that announces a failed measurement and then passes.
          needed=$(objdump -p "$SO" | grep NEEDED | sed 's/^ */  /') || true
          test -n "$needed" || {
            echo '::error::nothing was read from the addon; this measurement failed, do not read a pass into it'
            exit 1
          }

          {
            echo "### What \`${{ matrix.suffix }}\` must find at load"
            echo
            echo '```'
            printf '%s\n' "$needed"
            echo '```'
            echo
            echo 'Neither fontconfig nor freetype should appear above: the container links them statically.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # This one decides: it fails when the artefact demands more than its
      # `floors` in `TARGETS`. A floor declared too high fails nothing, so it
      # prints measured beside declared either way. A script, so it runs locally
      # too.
      - name: Check the ABI floors have not drifted
        if: runner.os == 'Linux'
        run: just abi-floor ${{ matrix.suffix }}

      # The gate: an unversioned symbol has no tag to compare, and
      # `_M_replace_cold` failed a binary under every ceiling. Nothing is
      # installed, as a `node:22-slim` consumer has no fontconfig. For musl,
      # which versions no symbols, this is the whole of the evidence.
      - name: Load it on the images this target claims
        if: runner.os == 'Linux'
        run: just acceptance ${{ matrix.suffix }}

      # The packed platform package must render before it is published.
      # `verify-packed`, not `verify-pack`, which would rebuild on the runner
      # over the container's binary. Skipped for musl, which cannot load on this
      # glibc runner; acceptance covers it on Alpine.
      - name: Install the tarballs somewhere else and render
        if: ${{ !contains(matrix.suffix, 'musl') }}
        run: just verify-packed

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarballs-${{ matrix.suffix }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [targets, build]
    runs-on: ubuntu-latest
    # Thirty minutes for the propagation gate below, whose own 1800-second
    # ceiling names the packages that never resolved; thirty for the publishes,
    # download, tag and release. Dry runs take about 30 seconds, but skip every
    # registry write, the wait and both GitHub calls.
    timeout-minutes: 60
    # The only job that needs either: `id-token` to mint provenance, `contents`
    # to push the tag and open the release. See the note at the top.
    permissions:
      contents: write
      id-token: write
      # Dispatching `docs.yml` at the end of this job. See that step for why a
      # release created with `GITHUB_TOKEN` cannot start it on its own.
      actions: write

    steps:
      # Full history and tags: the tag step checks for its tag in local refs,
      # which is what lets a re-run walk past a tag it already created.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Tells npm which registry to mint an OIDC credential for.
          registry-url: https://registry.npmjs.org

      # The npm bundled with Node LTS can predate OIDC support, in which case
      # publishing falls back to looking for a token and fails.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: tarballs-*
          merge-multiple: true

      # Every target's build must have produced its platform tarball. Publishing
      # a main package whose `optionalDependencies` name a package that was
      # never built leaves an install that resolves nothing on that platform,
      # and `fail-fast: false` means one target can fail while the rest succeed.
      - name: Check every target produced a tarball
        env:
          VERSION: ${{ needs.targets.outputs.version }}
          MATRIX: ${{ needs.targets.outputs.matrix }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          set -euo pipefail
          suffixes=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(JSON.parse(raw).include.map(entry => entry.suffix).join(' ')))
          " <<< "$MATRIX")

          # Counted before it is walked: a `for` over an empty list runs zero
          # times, and a failed substitution in its word list does not reach
          # `set -e`, so a broken matrix would report every target present.
          count=$(printf '%s\n' $suffixes | grep -c . || true)
          expected=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(String(JSON.parse(raw).include.length)))
          " <<< "$MATRIX")
          if [ "$count" != "$expected" ] || [ "$count" -eq 0 ]; then
            echo "::error::read ${count} targets from the matrix, expected ${expected}; this check looked at nothing"
            exit 1
          fi
          echo "checking ${count} platform tarballs"

          missing=0
          for suffix in $suffixes; do
            file="artifacts/${PREFIX}-${suffix}-${VERSION}.tgz"
            if [ ! -f "$file" ]; then
              echo "missing $file"
              missing=1
            fi
          done
          test "$missing" -eq 0

      # Platform packages first, main package last. The main package pins each
      # one at an exact version, so publishing it first points at versions that
      # do not exist yet and every install in that window fails.
      - name: Publish the platform packages
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          for file in artifacts/"${PREFIX}"-*-*.tgz; do
            case "$file" in
              # The main package's own tarball has no target suffix. Skipping it
              # by name rather than by position, because a glob's order is not a
              # promise.
              artifacts/${{ needs.targets.outputs.prefix }}-${{ needs.targets.outputs.version }}.tgz) continue ;;
            esac
            echo "==> $file"
            # Skip a version the registry already has: npm refuses to publish
            # over one (E403), and a hand-bootstrapped platform package would
            # otherwise stop every package behind it. Read from the tarball, not
            # its filename.
            name=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            version=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            # Recorded whether published now or already present, since the main
            # package depends on both. From the same `name` and `version` read
            # above, so the wait asks about the package published.
            echo "${name}@${version}" >> "$RUNNER_TEMP/platform-packages.txt"
            # `$DRY != true` first, so a rehearsal packs and validates every
            # package instead of skipping those already on the registry. The
            # main package's step reads the same way.
            if [ "$DRY" != "true" ] && npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "    ${name}@${version} is already on the registry; not publishing it again"
              continue
            fi
            # `./` because npm reads a bare relative path as git shorthand:
            # `artifacts/x.tgz` becomes `github:artifacts/x.tgz` and fails with
            # `EALLOWGIT`.
            if [ "$DRY" = "true" ]; then
              npm publish --dry-run --access public --tag "$TAG" "./$file"
            else
              npm publish --provenance --access public --tag "$TAG" "./$file"
            fi
          done

      # Published is not installable. The main package pins all seven at exact
      # versions and yarn resolves all seven before installing any, so one still
      # propagating fails every yarn install. Names come from
      # `platform-packages.txt`, written from each tarball, not a fourth list.
      - name: Wait for the platform packages to resolve
        if: ${{ !inputs.dry_run }}
        env:
          MATRIX: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/platform-packages.txt"

          # A wait over nothing is not a wait: an empty or short list would pass
          # every loop below. Checked against the matrix, the authoritative
          # target list.
          expected=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(String(JSON.parse(raw).include.length)))
          " <<< "$MATRIX")
          test -f "$list" || {
            echo "::error::the publish step recorded no platform packages; it did not run, or its glob matched nothing"
            exit 1
          }
          actual=$(wc -l < "$list" | tr -d ' ')
          if [ "$actual" != "$expected" ]; then
            echo "::error::recorded ${actual} platform packages, expected ${expected} from the build matrix"
            cat "$list"
            exit 1
          fi
          echo "waiting for ${actual} platform packages to resolve from the registry"

          # Waits on the fact, not a clock: each name is polled until it
          # resolves at this version. On 5 September 2026 that took from about
          # 10 to about 200 seconds, and two packages published six seconds
          # apart resolved apart. The ceiling below is not derived from those.
          remaining=$(cat "$list")
          # A hang-breaker: a broken publish fails naming the packages that
          # never appeared, rather than at GitHub's six-hour limit. Well past
          # any propagation seen.
          ceiling=1800
          deadline=$(( SECONDS + ceiling ))
          while :; do
            still=""
            for entry in $remaining; do
              if npm view "$entry" version >/dev/null 2>&1; then
                echo "  $entry resolves"
              else
                still="${still} ${entry}"
              fi
            done
            remaining=$(echo "$still" | tr -s ' ' | sed 's/^ //;s/ $//')
            if [ -z "$remaining" ]; then
              echo "every platform package resolves after ${SECONDS}s; publishing the main package"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            # Said out loud every round: a slow run and a stuck one print the
            # same nothing otherwise, and this is the only step in the file
            # whose duration is not its own to decide.
            echo "waited ${SECONDS}s, still waiting for:${still}"
            sleep 15
          done

          # **Failing, not proceeding.** A wait that gives up and carries on is
          # worse than no wait: it turns a release that is definitely broken
          # into one that is broken sometimes, and the window it leaves is the
          # one where an install of the main package cannot resolve.
          echo "::error::these did not resolve within ${ceiling}s:${remaining}"
          echo "::error::not publishing the main package against dependencies that cannot be installed"
          exit 1

      - name: Publish the main package
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          DRY: ${{ inputs.dry_run }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          set -euo pipefail
          file="artifacts/${PREFIX}-${VERSION}.tgz"
          test -f "$file"

          # The platform loop's skip, for the main package: without it a re-run
          # after a successful publish dies here, before the tag step it came to
          # finish. Read from the tarball, not `VERSION`.
          name=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$DRY" != "true" ] && npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; not publishing it again"
            exit 0
          fi

          # `./` for the reason the platform step gives: a bare relative path
          # is a git shorthand to npm.
          if [ "$DRY" = "true" ]; then
            npm publish --dry-run --access public --tag "$TAG" "./$file"
          else
            npm publish --provenance --access public --tag "$TAG" "./$file"
          fi

      # Tag and release after the registry accepts everything: a tag pushed
      # before a failed publish marks a version that can never be reissued,
      # which `meo-skia-canvas` carries. Tagging last leaves a failed publish
      # with the tree as it was.
      - name: Tag the commit and open a release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.targets.outputs.version }}
          TAG: ${{ needs.targets.outputs.tag }}
          NAME: ${{ needs.targets.outputs.name }}
        run: |
          set -euo pipefail
          git_tag="npm-v${VERSION}"

          # Notes are hand-written, one file per version, and a missing one
          # stops the release. The log is no substitute: most commits mean
          # nothing to an installer, and most subjects carry no `feat:` or
          # `fix:`. No fallback, which would make this unable to fail.
          notes_source="docs/releases/npm/${VERSION}.md"
          if [ ! -s "${notes_source}" ]; then
            echo "::error::${notes_source} is missing or empty. Release notes are written by hand, per channel and per version, against the previous release of that channel. Write it, commit it, and run this again."
            exit 1
          fi
          echo "notes from ${notes_source}"

          {
            echo "\`npm install ${NAME}@${VERSION}\`"
            echo ""
            if [ "${TAG}" = "next" ]; then
              echo "Published to the \`next\` dist-tag, so a plain \`npm install ${NAME}\` does not resolve it."
              echo ""
            fi
            cat "${notes_source}"
            echo ""
            # The reference for this version, which exists whether or not it is
            # the newest stable. The version, not the tag: `docs.yml` strips the
            # channel prefix from the directory name, so a link from
            # `${git_tag}` would 404.
            echo "---"
            echo ""
            echo "[API reference for v${VERSION}](https://l7aromeo.github.io/meo-canvas/v${VERSION}/)"
          } > notes.md

          # Both halves ask whether they already happened: the tag push and the
          # release are two commands, so a re-run walks past the half that
          # succeeded. A tag at another revision is a conflict and stops the
          # run. Tags are local because the checkout fetches them.
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/${git_tag}^{commit}"); then
            if [ "$existing" != "$head" ]; then
              echo "::error::${git_tag} already exists at ${existing}, and this run built ${head}"
              exit 1
            fi
            echo "${git_tag} already exists at this commit; not creating it again"
          else
            # An annotated tag records its author, so the runner needs an
            # identity: without one `git tag -a` exits 128, as on run
            # 33966045288 after every package reached npm. The Actions bot's
            # noreply address attributes it to the automation.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${git_tag}" -m "${NAME} ${VERSION}"
          fi
          # A no-op when the remote already has this exact tag, and a rejection
          # if it has a different one -- which is the check above arriving from
          # the other side, for a tag pushed after this job checked out.
          git push origin "${git_tag}"

          # `--prerelease` on the same rule the dist-tag uses, so a version that
          # npm keeps off `latest` is a version GitHub keeps off `latest` too and
          # the two cannot disagree about what is a prerelease.
          prerelease=""
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac

          if gh release view "${git_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "a release already exists under ${git_tag}; not opening a second one"
          else
            gh release create "${git_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${NAME} ${VERSION}" \
              --notes-file notes.md \
              ${prerelease} \
              artifacts/*.tgz
          fi

      # A release created with `GITHUB_TOKEN` raises no `release` event for
      # other workflows, so `docs.yml` would never deploy; `workflow_dispatch`
      # is a documented exception. Dispatched at the tag, the published commit.
      # `docs.yml` waits for all eight packages itself, so this only starts it.
      - name: Ask the reference workflow to deploy this version
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.targets.outputs.version }}
        run: |
          set -euo pipefail
          git_tag="npm-v${VERSION}"

          # Fails rather than warns: the packages and tag are out by now, but a
          # silent missing deploy is the defect, and the job re-runs safely past
          # what succeeded.
          before=$(gh run list --workflow docs.yml --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run docs.yml --ref "${git_tag}" -f tag="${git_tag}"

          # A dispatch returning success need not start a run, so the run is
          # looked for. The two minutes is a hang-breaker; runs appear within
          # seconds, and the message reads the same variable.
          appear=120
          deadline=$(( SECONDS + appear ))
          run_id=0
          run_url=""
          while :; do
            latest=$(gh run list --workflow docs.yml --event workflow_dispatch --limit 1 --json databaseId,url --jq '.[0]')
            id=$(printf '%s' "$latest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8') || '{}').databaseId || 0")
            if [ "$id" -gt "$before" ]; then
              run_id="$id"
              run_url=$(printf '%s' "$latest" | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).url")
              echo "started ${run_url}"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::dispatched docs.yml at ${git_tag} and no run appeared within ${appear}s"
              echo "::error::the packages are published and the release is open; re-run this job, or dispatch the reference workflow by hand"
              exit 1
            fi
            echo "waited ${SECONDS}s for the reference deploy to appear"
            sleep 5
          done

          # Started is not deployed: the run can publish nothing on a filtered
          # tag, be refused by the environment, or time out on the registry,
          # each leaving no reference. Twenty minutes over a ten-minute wait and
          # a quick build; a timeout says the run may still be going.
          finish=1200
          deadline=$(( SECONDS + finish ))
          while :; do
            state=$(gh run view "$run_id" --json status,conclusion --jq '"\(.status) \(.conclusion // "")"')
            case "$state" in
              completed\ success)
                echo "reference deployed: ${run_url}"
                exit 0
                ;;
              completed\ *)
                echo "::error::the reference deploy finished ${state#completed } -- ${run_url}"
                echo "::error::the packages are published, the tag is pushed and the release is open; only the reference is missing. Fix the cause and re-run that workflow, or dispatch it by hand at ${git_tag}"
                exit 1
                ;;
            esac
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::the reference deploy has not finished within ${finish}s and may still be running -- ${run_url}"
              echo "::error::the release itself is complete; check that run before dispatching another"
              exit 1
            fi
            sleep 15
          done

      - name: Say what happened
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          NAME: ${{ needs.targets.outputs.name }}
        run: |
          {
            echo "### ${{ inputs.dry_run && 'Dry run' || 'Published' }} \`${NAME}@${VERSION}\`"
            echo ""
            echo "dist-tag: \`${TAG}\`"
            if [ "${TAG}" = "next" ]; then
              echo ""
              echo "\`npm install ${NAME}\` does not resolve this; ask for it by name:"
              echo ""
              echo "\`\`\`"
              echo "npm install ${NAME}@${VERSION}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
