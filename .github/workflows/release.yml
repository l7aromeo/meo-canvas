name: release

# A dry run and a real publish look identical in the Actions list unless the run
# says which it is.
run-name: >-
  ${{ inputs.dry_run && 'release — DRY RUN (nothing is published)' || 'release — publish' }}

# Manual only. Nothing publishes on a push, because a push is how code arrives
# and publishing is a decision about code that already arrived. `just release`
# is what a person runs; this is what it triggers.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and pack every target, validate the publish, but do not publish'
        type: boolean
        default: true

# Read at the top, and widened only where the widening is used. `id-token:
# write` is what lets npm mint a provenance attestation from the workflow's own
# identity, so no long-lived token is stored anywhere -- but only the publish
# job publishes, and a token seven build jobs can mint is seven machines that
# can speak as this repository while compiling third-party code. `contents:
# write` is what lets that same job tag the commit it published and open a
# release under the tag; without it nothing on GitHub records which commit a
# version on the registry was built from. Both live on `publish` below.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every `run:` block here is bash -- `set -euo pipefail`, `test -f`, `$(...)`,
# `grep | cut`. On `windows-latest` the default shell is PowerShell, so the
# first such step failed with the toolchain unread and the Windows target has
# never built once. Declared for the whole workflow rather than on that step,
# because the next Windows-only failure would be the next step someone wrote in
# bash without thinking about it -- which is every step in this file.
defaults:
  run:
    shell: bash

jobs:
  # The target list lives in `tools/stage-platform-package.mjs` and is read here
  # rather than restated, so a target added there builds without touching this
  # file. `src/addon.test.ts` asserts that list against the two other places a
  # target is named; this is the third consumer and the only one that cannot be
  # checked by a unit test.
  targets:
    name: targets
    runs-on: ubuntu-latest
    # A checkout, a Node install and one `node -p`. Ten minutes is not a budget
    # for that -- it is a bound on a checkout or an action download that has
    # stopped rather than slowed, which without it holds a runner for GitHub's
    # six-hour default.
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      version: ${{ steps.read.outputs.version }}
      tag: ${{ steps.read.outputs.tag }}
      name: ${{ steps.read.outputs.name }}
      prefix: ${{ steps.read.outputs.prefix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      - name: Read the targets, the version and the dist-tag
        id: read
        run: |
          echo "matrix=$(node packages/meo-canvas/tools/stage-platform-package.mjs --matrix)" >> "$GITHUB_OUTPUT"
          version=$(node -p "require('./packages/meo-canvas/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # The package name, and the prefix `npm pack` builds a filename from:
          # it drops a leading `@` and turns `/` into `-`, so `@scope/thing`
          # packs as `scope-thing-1.0.0.tgz` and `thing` as `thing-1.0.0.tgz`.
          # Derived rather than written down, because it WAS written down, in
          # seven places, and a rename then made every glob below match nothing
          # while every local check stayed green.
          name=$(node -p "require('./packages/meo-canvas/package.json').name")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "prefix=$(node -p "require('./packages/meo-canvas/package.json').name.replace(/^@/, '').replace('/', '-')")" >> "$GITHUB_OUTPUT"
          # A version carrying a prerelease part goes to `next`, never to
          # `latest`. This is what makes an alpha safe to cut: `npm install`
          # resolves `latest`, and a semver range never matches a prerelease,
          # so nobody reaches it without asking for it by name.
          case "$version" in
            *-*) tag=next ;;
            *)   tag=latest ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $version to dist-tag $tag"

  # One runner per target, each building only its own binary. Cross-compiling
  # Skia is a different problem from building it, and a runner per target buys
  # the answer without solving it.
  build:
    name: build ${{ matrix.suffix }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    # **One bound over legs that differ by forty-fold.** Today's release run:
    # 54s, 2m20s, 2m57s, 5m59s, 8m03s, 22m56s, 36m48s. The two slow ones compile
    # Skia from source in a container; `darwin-arm64` finishes in under a
    # minute. `timeout-minutes` applies per matrix leg, so the number has to fit
    # the slowest or it kills builds that are working.
    #
    # Ninety, which is what `ci.yml` uses for the same compile and for the same
    # reason -- its own note records 16 to 23 minutes normally and a 52-minute
    # run when the Skia cache missed. That outlier is the case this has to
    # clear: today's 36m48s was a warm-cache number and a cold one is the
    # release nobody wants to fail on the clock.
    #
    # It is a hang-breaker rather than a prediction, and the difference matters
    # if a build ever approaches it: that is a reason to find out what changed,
    # not to raise the number.
    timeout-minutes: 90
    strategy:
      # Every target reports. Cancelling the set on one failure hides whether
      # the fault is one platform or the code.
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      # A block scalar, and the quoting is the reason. Written on one line this
      # needed `cut -d'\"'`, where YAML keeps the backslash literal and hands
      # `cut` a two-character delimiter -- so the step succeeded, wrote nothing,
      # and the toolchain action failed three steps later with `'toolchain' is
      # a required input`. The failure named the consumer and not the producer.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "toolchain $channel"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: release-${{ matrix.suffix }}
          cache-bin: true

      # **No system libraries are installed for the Linux builds, and that is the
      # change rather than an omission.** cmake, nasm and the font development
      # packages used to be installed here, because the addon was built on the
      # runner. It is now built in `containers/Dockerfile.{glibc,musl}`, which
      # carries all of them and links freetype and fontconfig statically -- so
      # the runner needs none of it either to build or to load the result.
      #
      # The Rust toolchain below is likewise not what compiles the Linux addon;
      # the container pins its own. It stays because `rust-cache` populates
      # `~/.cargo/registry`, which `addon-container` mounts into the build, and
      # because macOS and Windows do build on the runner.

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # bun installs the packages; `just pack` builds `dist` with tsc from them.
      # `npm pack` and `npm publish` stay npm further down: the tarball naming
      # `release.yml` derives its globs from is npm's, and provenance is npm's.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'
      - name: Install the JavaScript dependencies
        run: bun install --frozen-lockfile

      # `just pack` builds the release addon, builds `dist`, stages the platform
      # package for this host and packs both tarballs. The same recipe a person
      # runs locally, so a release cannot take a path nobody has walked.
      - name: Build and pack
        if: runner.os != 'Linux'
        run: just pack

      # Linux builds in a container, and the reason is measured rather than
      # cautious: the same source built on `ubuntu-latest` demanded glibc 2.35
      # and failed to load on five of the six images this package claims, and
      # built in `containers/Dockerfile.glibc` demands 2.28 and loads on all
      # six. **A Linux artefact is a property of its build base.**
      #
      # `pack-container` is passed the suffix rather than deriving it, because
      # the runner cannot tell you which image built the binary: on this x64
      # glibc runner `--host` answers `linux-x64-gnu` for a musl build too.
      - name: Build in the release image and pack
        if: runner.os == 'Linux'
        run: just pack-container ${{ matrix.suffix }}

      # What the binary must find at load, printed for a reader. The floors it
      # demands are no longer printed here: they are asserted by the next step,
      # and a number printed in one place and checked in another is a number
      # that can disagree with itself.
      #
      # A missing read is not a pass. If the binary cannot be parsed at all the
      # step says so loudly, because "nothing needed" and "nothing read" print
      # the same way and only one of them is good news.
      - name: Say what the Linux binary must find
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # The path `just addon-container` writes, which is per target and
          # deliberately not the native addon's. See `container_addon` in the
          # justfile: a cross-build that overwrote `addon_path` disarmed every
          # local check needing the native binary.
          SO="target/container/${{ matrix.suffix }}/meo-canvas.node"
          # Single quotes around the message on purpose: backticks inside a
          # double-quoted shell string are command substitution, and this one
          # would have run `just pack` a second time to build its own error.
          test -f "$SO" || { echo '::error::the addon is not where the pack step leaves it'; exit 1; }

          # Read and checked BEFORE the summary block, not inside it. A `{ ... }
          # group on the left of a pipe is a subshell, so an `exit 1` in there
          # ends the subshell and leaves the pipeline reporting `tee`'s success
          # -- a step that announces a failed measurement and then passes.
          needed=$(objdump -p "$SO" | grep NEEDED | sed 's/^ */  /') || true
          test -n "$needed" || {
            echo '::error::nothing was read from the addon; this measurement failed, do not read a pass into it'
            exit 1
          }

          {
            echo "### What \`${{ matrix.suffix }}\` must find at load"
            echo
            echo '```'
            printf '%s\n' "$needed"
            echo '```'
            echo
            echo 'Neither fontconfig nor freetype should appear above: the container links them statically.'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # **This one decides.** It compares what the artefact demands against the
      # `floors` its target declares in `TARGETS`, and fails when the artefact
      # asks for more -- a build base that moved, or a dependency that started
      # using a newer symbol.
      #
      # It is a script rather than an inline block so it runs locally, and so a
      # second Linux family is not a second copy of the logic.
      #
      # **What it cannot catch is a floor declared too high**, which fails
      # nothing and quietly tells consumers to expect a newer machine than they
      # need -- exactly the drift that sat unnoticed for three commits after the
      # container lowered the real numbers. So it prints the measured value
      # beside the declared one whether or not it exceeds. Reading them is part
      # of reading a release.
      - name: Check the ABI floors have not drifted
        if: runner.os == 'Linux'
        run: just abi-floor ${{ matrix.suffix }}

      # And this is the gate. A ceiling compares version tags, and **an
      # unversioned symbol has none**: a binary reporting `GLIBCXX_3.4.21`,
      # under every ceiling above, still failed to load on `_M_replace_cold`, a
      # GCC 12 symbol carrying no version at all. Only loading it settles that.
      #
      # Nothing is installed into any image, because the point is what a
      # consumer gets and a consumer running `node:22-slim` has no fontconfig.
      #
      # For the musl pair this is the whole of the evidence -- musl does not
      # version its symbols, so the step above has nothing to compare and says
      # so rather than passing silently.
      - name: Load it on the images this target claims
        if: runner.os == 'Linux'
        run: just acceptance ${{ matrix.suffix }}

      # The addon has to load from the packed platform package before that
      # package is worth publishing. Rendering is the check — a `require` that
      # resolves proves the file is present, not that it runs.
      #
      # `verify-packed` and not `verify-pack`: the latter re-runs `pack`, which
      # builds the addon on the runner and would overwrite the one the container
      # produced. The artefact verified has to be the artefact published.
      #
      # **Skipped for musl, because it runs on the runner and the runner is
      # glibc.** A musl `.so` cannot be loaded there at all, so the step would
      # report a packaging fault about a packaging arrangement that is fine. The
      # acceptance step above is what answers for those targets, on Alpine; what
      # is lost is the check that `exports` and `files` line up, and that is the
      # same arrangement the four non-musl targets exercise on the same commit.
      - name: Install the tarballs somewhere else and render
        if: ${{ !contains(matrix.suffix, 'musl') }}
        run: just verify-packed

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarballs-${{ matrix.suffix }}
          path: release/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: [targets, build]
    runs-on: ubuntu-latest
    # **Thirty of these belong to the propagation gate below**, which carries
    # its own 1800-second ceiling and fails naming the packages that never
    # resolved. A bound at or under that would kill the wait instead of the
    # hang, and report a timeout where the gate had a better answer ready.
    #
    # The other thirty are the work around it -- eight `npm publish` calls, an
    # artefact download, a tag and a release -- and a bound on the thing the
    # gate cannot see: a publish or a `gh` call that has stopped rather than
    # slowed.
    #
    # **This job has been timed, but never doing the half the bound is for.**
    # Two dry runs: 27 seconds (run 33961676649) and 31 seconds (run
    # 33852331873). Those cover the checkout, the artefact download, the
    # tarball validation and eight `--dry-run` publishes -- with the gate
    # skipped, no version written to the registry, and no tag or release
    # created. So half a minute is what everything *except* the eight registry
    # writes, the wait and the two GitHub calls costs, and the rest of the sixty
    # is headroom for work that has never run. Unlike the build's number, this
    # one is sized from what is inside the job rather than from what it has
    # taken; when a real release gives a figure, that is the moment to revisit
    # it downward rather than leaving a number nobody can account for.
    timeout-minutes: 60
    # The only job that needs either: `id-token` to mint provenance, `contents`
    # to push the tag and open the release. See the note at the top.
    permissions:
      contents: write
      id-token: write

    steps:
      # **Full history and tags, because the release notes are a range.** The
      # default checkout is one commit with no tags, so
      # `git describe --tags` found nothing, the notes step took its
      # "no previous tag" branch, and `git log HEAD` on a one-commit clone
      # produced notes consisting of a single subject line -- while printing
      # that they covered the whole history. Reproduced on a `--depth 1` clone
      # of this repository: 1 commit, 0 tags, describe empty, notes one line.
      #
      # It is also what lets the tag step below ask whether its tag already
      # exists without going to the network for the answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          # Tells npm which registry to mint an OIDC credential for.
          registry-url: https://registry.npmjs.org

      # The npm bundled with Node LTS can predate OIDC support, in which case
      # publishing falls back to looking for a token and fails.
      - name: Use an npm that supports OIDC
        run: npm install -g npm@latest

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: tarballs-*
          merge-multiple: true

      # Every target's build must have produced its platform tarball. Publishing
      # a main package whose `optionalDependencies` name a package that was
      # never built leaves an install that resolves nothing on that platform,
      # and `fail-fast: false` means one target can fail while the rest succeed.
      - name: Check every target produced a tarball
        env:
          VERSION: ${{ needs.targets.outputs.version }}
          MATRIX: ${{ needs.targets.outputs.matrix }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          set -euo pipefail
          suffixes=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(JSON.parse(raw).include.map(entry => entry.suffix).join(' ')))
          " <<< "$MATRIX")

          # **Counted before it is walked.** A `for` over an empty word list
          # runs its body zero times and leaves `missing` at zero, so a node
          # invocation that failed -- a matrix that did not parse, a schema that
          # moved -- reported every target present having looked at none. The
          # command substitution's own failure does not reach `set -e` from a
          # `for` list either, so nothing else here would have said so.
          count=$(printf '%s\n' $suffixes | grep -c . || true)
          expected=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(String(JSON.parse(raw).include.length)))
          " <<< "$MATRIX")
          if [ "$count" != "$expected" ] || [ "$count" -eq 0 ]; then
            echo "::error::read ${count} targets from the matrix, expected ${expected}; this check looked at nothing"
            exit 1
          fi
          echo "checking ${count} platform tarballs"

          missing=0
          for suffix in $suffixes; do
            file="artifacts/${PREFIX}-${suffix}-${VERSION}.tgz"
            if [ ! -f "$file" ]; then
              echo "missing $file"
              missing=1
            fi
          done
          test "$missing" -eq 0

      # Platform packages first, main package last. The main package pins each
      # one at an exact version, so publishing it first points at versions that
      # do not exist yet and every install in that window fails.
      - name: Publish the platform packages
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          DRY: ${{ inputs.dry_run }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          for file in artifacts/"${PREFIX}"-*-*.tgz; do
            case "$file" in
              # The main package's own tarball has no target suffix. Skipping it
              # by name rather than by position, because a glob's order is not a
              # promise.
              artifacts/${{ needs.targets.outputs.prefix }}-${{ needs.targets.outputs.version }}.tgz) continue ;;
            esac
            echo "==> $file"
            # **Skip a version the registry already has, and say so.** npm
            # refuses to publish over an existing version (E403), and this loop
            # runs before the main package on purpose -- so one platform
            # package already on the registry would stop every package behind
            # it. That is exactly the state a bootstrap leaves: the first
            # release of a new platform package cannot use OIDC, because a
            # trusted publisher is configured on a package's settings page and
            # a package that has never been published has none. So the seven
            # were published once by hand, from the same tarballs this run
            # built, and this run has to walk past them to reach the main
            # package. Read from the tarball rather than the filename, so a
            # renamed file cannot make the check ask about a different package.
            name=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
            version=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
            # Recorded whether it is published here or was already present:
            # the next step waits for what the main package will depend on,
            # and a package published by hand an hour ago is as much a
            # dependency as one published a second ago. Written from the same
            # `name` and `version` this loop read out of the tarball, so the
            # wait cannot be asking about a different package than the publish.
            echo "${name}@${version}" >> "$RUNNER_TEMP/platform-packages.txt"
            if npm view "${name}@${version}" version >/dev/null 2>&1; then
              echo "    ${name}@${version} is already on the registry; not publishing it again"
              continue
            fi
            # `./` is not decoration. npm reads a bare relative path as a git
            # shorthand, so `artifacts/x.tgz` becomes `github:artifacts/x.tgz`
            # and fails with `EALLOWGIT: Refusing to fetch`. Only a rehearsal
            # that got past the build could find this, which is why the build
            # being red for two rounds hid it.
            if [ "$DRY" = "true" ]; then
              npm publish --dry-run --access public --tag "$TAG" "./$file"
            else
              npm publish --provenance --access public --tag "$TAG" "./$file"
            fi
          done

      # **Published and installable are not the same moment.** The main package
      # pins all seven platform packages at an exact version, so publishing it
      # while one of them is still propagating puts a package on the registry
      # that cannot be installed -- and npm and pnpm would hide it, because they
      # skip an optional dependency whose `os`/`cpu`/`libc` excludes the host
      # and never ask the registry about it. **yarn resolves all seven before
      # installing any**, and a 404 on one fails the whole install; AGENTS.md
      # carries the `YN0035` transcript.
      #
      # `docs.yml` has waited for exactly this since it was written -- its
      # comment says "published and installable are separated by propagation" --
      # and the reasoning was applied to the docs deploy and never to the
      # publish the docs deploy is downstream of.
      #
      # The names come from `platform-packages.txt`, which the loop above wrote
      # out of each tarball's own `package.json`. Not a list written here: a
      # target is already named in three places with a test asserting they
      # agree, and a fourth list is the drift that rule exists to prevent.
      - name: Wait for the platform packages to resolve
        if: ${{ !inputs.dry_run }}
        env:
          MATRIX: ${{ needs.targets.outputs.matrix }}
        run: |
          set -euo pipefail
          list="$RUNNER_TEMP/platform-packages.txt"

          # **A wait over nothing is not a wait.** An empty or short list would
          # sail through every loop below and report success, which is the
          # failure this file must not have: it would mean the main package is
          # published against unresolved dependencies with a green step above
          # saying otherwise. Checked against the matrix, which is the
          # authoritative target list, rather than against a number written
          # here.
          expected=$(node -e "
            let raw = ''
            process.stdin.on('data', chunk => { raw += chunk })
            process.stdin.on('end', () => process.stdout.write(String(JSON.parse(raw).include.length)))
          " <<< "$MATRIX")
          test -f "$list" || {
            echo "::error::the publish step recorded no platform packages; it did not run, or its glob matched nothing"
            exit 1
          }
          actual=$(wc -l < "$list" | tr -d ' ')
          if [ "$actual" != "$expected" ]; then
            echo "::error::recorded ${actual} platform packages, expected ${expected} from the build matrix"
            cat "$list"
            exit 1
          fi
          echo "waiting for ${actual} platform packages to resolve from the registry"

          # **The loop waits on the fact, not on a clock.** Its exit condition
          # is that every recorded name resolves at the exact version being
          # published; if that happens in twenty seconds it takes twenty
          # seconds. A fixed sleep long enough to be safe would make every
          # release pay the worst case, and one short enough to be tolerable
          # would be a guess that is wrong on the day the registry is slow.
          #
          # **Why the loop exists at all is measured, and the spread is the
          # point.** Publish-to-resolvable across 5 September 2026, on our own
          # packages: about 10 seconds, about 90, about 122, no more than 171,
          # about 200 -- and one `E404` from `npm view` persisting over 100
          # seconds after a publish that returned exit 0. **A twenty-fold
          # spread, same registry, same session, same machine.** Method: `npm
          # view <name>@<version> version` polled every 10 seconds, against the
          # registry's own `time` field rather than a local clock.
          #
          # That spread is the argument for a heartbeat over any fixed wait. A
          # sleep long enough to cover the slow end is mostly waste on the fast
          # end, and one chosen to feel reasonable would eventually publish the
          # main package into a window where its own pinned dependencies 404.
          #
          # **The readings say propagation is real; they do not say how long to
          # wait.** The ceiling below is deliberately not derived from them --
          # a handful of samples from one machine is a floor on the delay, not
          # a distribution, and turning them into a bound would dress a guess as
          # a measurement.
          #
          # **Every name is polled independently, and that is measured too.**
          # Two packages published six seconds apart did not become resolvable
          # together -- one at about 122 seconds while the other still was not
          # -- so a gate that polled one and inferred the rest would pass on
          # whichever landed first. Each round asks only about what is still
          # missing, so the slowest name sets the wait rather than the sum of
          # them.
          remaining=$(cat "$list")
          # **A hang-breaker, not a prediction.** Nothing here expects to wait
          # half an hour; this exists so a publish that is genuinely broken
          # fails with a message naming the packages that never appeared,
          # instead of spinning until the job hits GitHub's own six-hour limit
          # and leaves an error pointing at nothing. Generously past any
          # propagation we have seen or have reason to expect.
          ceiling=1800
          deadline=$(( SECONDS + ceiling ))
          while :; do
            still=""
            for entry in $remaining; do
              if npm view "$entry" version >/dev/null 2>&1; then
                echo "  $entry resolves"
              else
                still="${still} ${entry}"
              fi
            done
            remaining=$(echo "$still" | tr -s ' ' | sed 's/^ //;s/ $//')
            if [ -z "$remaining" ]; then
              echo "every platform package resolves after ${SECONDS}s; publishing the main package"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              break
            fi
            # Said out loud every round: a slow run and a stuck one print the
            # same nothing otherwise, and this is the only step in the file
            # whose duration is not its own to decide.
            echo "waited ${SECONDS}s, still waiting for:${still}"
            sleep 15
          done

          # **Failing, not proceeding.** A wait that gives up and carries on is
          # worse than no wait: it turns a release that is definitely broken
          # into one that is broken sometimes, and the window it leaves is the
          # one where an install of the main package cannot resolve.
          echo "::error::these did not resolve within ${ceiling}s:${remaining}"
          echo "::error::not publishing the main package against dependencies that cannot be installed"
          exit 1

      - name: Publish the main package
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          DRY: ${{ inputs.dry_run }}
          PREFIX: ${{ needs.targets.outputs.prefix }}
        run: |
          set -euo pipefail
          file="artifacts/${PREFIX}-${VERSION}.tgz"
          test -f "$file"

          # **The same skip the platform loop has, and for the same reason one
          # step further on.** npm refuses to publish over an existing version,
          # so a re-run of a release that succeeded died here -- and it died
          # *before* the tag step, which is the half that had not run if the
          # first attempt failed after publishing. That made the one state a
          # re-run exists to repair the one state a re-run could not reach.
          #
          # Read from inside the tarball rather than from `VERSION`, so this
          # asks about the package that is actually about to be published.
          name=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).name")
          version=$(tar -xzOf "$file" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          if [ "$DRY" != "true" ] && npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} is already on the registry; not publishing it again"
            exit 0
          fi

          # `./` for the reason the platform step gives: a bare relative path
          # is a git shorthand to npm.
          if [ "$DRY" = "true" ]; then
            npm publish --dry-run --access public --tag "$TAG" "./$file"
          else
            npm publish --provenance --access public --tag "$TAG" "./$file"
          fi

      # Tag and release AFTER the registry has accepted everything, never before.
      # A tag pushed first and a publish that then fails leaves a tag with no
      # release under it and a version number that can never be reissued --
      # `meo-skia-canvas` has that scar, from a `gh` call that failed for an
      # unrelated reason once the tag was already up. Tagging last means a
      # failed publish leaves the tree exactly as it was.
      - name: Tag the commit and open a release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.targets.outputs.version }}
          TAG: ${{ needs.targets.outputs.tag }}
          NAME: ${{ needs.targets.outputs.name }}
        run: |
          set -euo pipefail
          git_tag="v${VERSION}"

          # The notes are the commit subjects since the last tag, verbatim.
          #
          # Not a conventional-commit parser: 26 of the last 40 subjects here
          # carry no `feat:`/`fix:` prefix, so a parser would silently drop two
          # thirds of the history -- including the changes that matter most,
          # which are the ones someone took the trouble to name in a sentence.
          # The subjects in this repository are already written as one-line
          # summaries of what changed and why, so the log is the release note
          # and reformatting it only loses information.
          # Excludes the tag this run is about to create, which matters on a
          # re-run: without `--exclude` a second attempt describes its own tag
          # and produces notes covering nothing.
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude "${git_tag}" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="${previous}..HEAD"
            echo "notes cover ${range}"
          else
            range="HEAD"
            echo "no previous tag; notes cover the whole history"
          fi

          {
            echo "\`npm install ${NAME}@${VERSION}\`"
            echo ""
            if [ "${TAG}" = "next" ]; then
              echo "Published to the \`next\` dist-tag, so a plain \`npm install ${NAME}\` does not resolve it."
              echo ""
            fi
            echo "## Changes"
            echo ""
            git log --no-merges --format='- %s' "${range}"
          } > notes.md

          # **Both halves ask whether they have already happened.** The tag is
          # pushed and the release is opened by two commands with a window
          # between them, and a failure in that window used to leave a tag with
          # no release under it and no way to finish -- which is the scar
          # `meo-skia-canvas` wears and the reason everything above it is
          # ordered the way it is. The window is still there; what changed is
          # that it is no longer terminal, because a re-run walks past the half
          # that succeeded and completes the half that did not.
          #
          # **Not silently, when the tag names a different commit.** A tag that
          # exists at another revision is a real conflict -- someone released
          # this version from elsewhere -- and skipping past it would attach a
          # release to a commit this run did not build. Tags are local here
          # because the checkout fetches them.
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/${git_tag}^{commit}"); then
            if [ "$existing" != "$head" ]; then
              echo "::error::${git_tag} already exists at ${existing}, and this run built ${head}"
              exit 1
            fi
            echo "${git_tag} already exists at this commit; not creating it again"
          else
            # **An annotated tag records who made it, so the runner needs an
            # identity.** Without one `git tag -a` exits 128 with "empty ident
            # name" -- which is what happened on the first real release,
            # 5 September 2026, run 33966045288: every package reached npm and
            # the job then died here, leaving the version published with no tag
            # and no release. A lightweight tag would not have needed this, and
            # is exactly what was given up to keep the annotation; this is the
            # cost of that trade, paid once.
            #
            # `github-actions[bot]` with its numeric noreply address is the
            # identity GitHub attributes to the Actions bot, so the tag is
            # attributed to the automation rather than to a person who did not
            # make it.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${git_tag}" -m "${NAME} ${VERSION}"
          fi
          # A no-op when the remote already has this exact tag, and a rejection
          # if it has a different one -- which is the check above arriving from
          # the other side, for a tag pushed after this job checked out.
          git push origin "${git_tag}"

          # `--prerelease` on the same rule the dist-tag uses, so a version that
          # npm keeps off `latest` is a version GitHub keeps off `latest` too and
          # the two cannot disagree about what is a prerelease.
          prerelease=""
          case "${VERSION}" in *-*) prerelease="--prerelease" ;; esac

          if gh release view "${git_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "a release already exists under ${git_tag}; not opening a second one"
          else
            gh release create "${git_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${NAME} ${VERSION}" \
              --notes-file notes.md \
              ${prerelease} \
              artifacts/*.tgz
          fi

      - name: Say what happened
        env:
          TAG: ${{ needs.targets.outputs.tag }}
          VERSION: ${{ needs.targets.outputs.version }}
          NAME: ${{ needs.targets.outputs.name }}
        run: |
          {
            echo "### ${{ inputs.dry_run && 'Dry run' || 'Published' }} \`${NAME}@${VERSION}\`"
            echo ""
            echo "dist-tag: \`${TAG}\`"
            if [ "${TAG}" = "next" ]; then
              echo ""
              echo "\`npm install ${NAME}\` does not resolve this; ask for it by name:"
              echo ""
              echo "\`\`\`"
              echo "npm install ${NAME}@${VERSION}"
              echo "\`\`\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
