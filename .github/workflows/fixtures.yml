name: fixtures

# Renders the golden fixtures on a platform this machine is not, and uploads
# what it produced.
#
# **A golden is a property of the architecture that drew it.** macOS on arm64,
# Linux on x86_64 and Windows on x86_64 rasterise anti-aliased edges
# differently, so `tests/fixtures.rs` compares against `expected.<os>-<arch>.png`
# where one exists and `expected.png` otherwise. `just fixtures-linux` makes the
# Linux set in the release container; there is no equivalent for Windows on a
# developer's Mac, and this is it.
#
# It writes nothing to the branch: it uploads an artifact, and a person looks at
# the images before committing them. A workflow that pushed accepted goldens
# would be a workflow that can turn a rendering regression into a commit without
# anyone seeing it.
run-name: >-
  fixtures — render the goldens

# **Both triggers, and the push one is not redundant.** `workflow_dispatch`
# requires the workflow file to exist on the repository's default branch, and
# this repository's default is `main` -- v1's semantic-release branch, which
# nothing about v10 should be pushed to. So until 10.x is the default, a push to
# a `fixtures/**` branch is how this is run.
on:
  workflow_dispatch:
    inputs:
      os:
        description: "The runner to render on"
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest
  push:
    branches: ["fixtures/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every `run:` here is bash, and `windows-latest` defaults to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  accept:
    name: accept on ${{ inputs.os || matrix.os }}
    # A push carries no inputs, so the branch runs every platform that has a
    # rasteriser of its own and lets the artifacts say which needed a variant.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ inputs.os || matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fixtures-${{ inputs.os || matrix.os }}

      # The same two the CI job installs, and for the same reasons: libaom
      # assembles its hot paths on x86, and Skia links the system font
      # libraries on Linux.
      - name: Install what the build needs
        run: |
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y cmake nasm pkg-config libfontconfig1-dev libfreetype-dev
              ;;
            Windows)
              choco install nasm --no-progress -y
              echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
              ;;
          esac

      # No `--features`, because this has to reproduce the run that fails. `just
      # test` renders the fixtures first under a bare `cargo test --workspace`
      # and again with the host's GPU feature, and it is the bare pass whose
      # comparison CI reports. Accepting from a different build than the one
      # being checked would pin a picture the gate never produces.
      # The set is read from the report rather than typed, and the reason the
      # "one name at a time" rule still holds is that **this commits nothing**.
      # That rule exists so a bulk accept cannot become a commit unseen; here
      # the output is an artifact somebody opens. Naming eight fixtures by hand
      # for a push trigger that carries no inputs would only move the typing.
      - name: Accept every fixture that differs
        run: |
          set -euo pipefail
          # `|| true` on the render, because a differing fixture is what this
          # exists to find and the test reports it by failing. Without it
          # `set -e` ends the step on exactly the outcome it came for.
          report=$(cargo test -p meo-canvas-core --test fixtures -- --nocapture 2>&1 || true)
          printf '%s\n' "$report" | tail -20
          names=$(printf '%s\n' "$report" \
            | sed -n 's/^  `\([a-z0-9-]*\)`: .* pixels differ.*/\1/p' | sort -u)
          if [ -z "$names" ]; then
            echo "every fixture matches the reference on this platform; no variant is needed"
            exit 0
          fi
          echo "differing: $names"
          for name in $names; do
            echo "==> $name"
            MEO_FIXTURE_ACCEPT="$name" cargo test -p meo-canvas-core --test fixtures
          done

      # Both the accepted goldens and the `actual`/`expected`/`diff` triples the
      # harness writes on a mismatch, so a reviewer can look at what changed
      # rather than take the run's word for it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures-${{ inputs.os || matrix.os }}
          path: |
            fixtures/**/expected.*.png
            target/fixtures/**
          if-no-files-found: error
          retention-days: 7
