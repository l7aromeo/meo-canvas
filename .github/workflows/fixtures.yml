name: fixtures

# Renders the goldens on another platform and uploads them. Anti-aliased edges
# rasterise differently per architecture, so `tests/fixtures.rs` compares
# against `expected.<os>-<arch>.png` where one exists. It commits nothing: a
# person looks at the images, so a regression cannot become a commit unseen.
run-name: >-
  fixtures — render the goldens

# `workflow_dispatch` chooses the runner; a push to a `fixtures/**` branch
# renders on Windows and Linux without one.
on:
  workflow_dispatch:
    inputs:
      os:
        description: 'The runner to render on'
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest
  push:
    branches: ['fixtures/**']

permissions:
  contents: read

# Keyed by ref and runner: one branch on two runners runs both, while two runs
# of one pair would race one artifact name. Not cancelled, since a forty-minute
# render is not superseded the way a gate result is.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.os || 'matrix' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Every `run:` here is bash, and `windows-latest` defaults to PowerShell.
defaults:
  run:
    shell: bash

jobs:
  accept:
    name: accept on ${{ inputs.os || matrix.os }}
    # A push carries no inputs, so the branch runs every platform that has a
    # rasteriser of its own and lets the artifacts say which needed a variant.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ inputs.os || matrix.os }}
    # Fifteen minutes warm, and a cold Skia is the long pole. The bound is on a
    # build that has stopped rather than one that is slow.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `setup-just`: the steps call `cargo` directly, reproducing the bare
      # `cargo test` whose comparison CI reports, and read the toolchain with
      # grep.

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Restores, never saves: a `fixtures/**` branch dies with its pull
      # request, so its cache could never be read. `ci.yml`'s entries are out of
      # reach as well, since rust-cache appends the job id (`ci` there, `accept`
      # here); sharing needs `add-job-id-key: false` in both.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: fixtures-${{ inputs.os || matrix.os }}
          save-if: false

      # The same two the CI job installs, and for the same reasons: libaom
      # assembles its hot paths on x86, and Skia links the system font
      # libraries on Linux.
      - name: Install what the build needs
        run: |
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              sudo apt-get install -y cmake nasm pkg-config libfontconfig1-dev libfreetype-dev
              ;;
            Windows)
              choco install nasm --no-progress -y
              echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
              ;;
          esac

      # No `--features`, reproducing the bare `cargo test --workspace` pass
      # whose comparison CI reports. The set comes from the report rather than
      # names: this commits nothing, so the one-at-a-time rule of
      # `fixtures-accept` does not apply.
      - name: Accept every fixture that differs
        run: |
          set -euo pipefail
          # The status and the parse are both needed: a compile error, missing
          # font or early panic names no fixture, so the parse alone would
          # report every fixture matching. The upload cannot tell either, since
          # committed variants always match its path.
          set +e
          report=$(cargo test -p meo-canvas-core --test fixtures -- --nocapture 2>&1)
          status=$?
          set -e
          printf '%s\n' "$report" | tail -30

          if [ "$status" -eq 0 ]; then
            echo "every fixture matches the reference on this platform; no variant is needed"
            exit 0
          fi

          # `fixtures.rs` reports four shapes and this reads one. A size
          # mismatch, bytes differing where pixels agree, and a missing
          # reference fall through to the refusal below, since an accept would
          # hide them.
          names=$(printf '%s\n' "$report" \
            | sed -n 's/^  `\([a-z0-9-]*\)`: .* pixels differ.*/\1/p' | sort -u)
          if [ -z "$names" ]; then
            echo "::error::the fixture test failed (exit ${status}) and named no differing fixture, so this is not a rasteriser difference to accept; read the log above"
            exit "$status"
          fi

          echo "differing: $names"
          for name in $names; do
            echo "==> $name"
            MEO_FIXTURE_ACCEPT="$name" cargo test -p meo-canvas-core --test fixtures
          done

      # Both the accepted goldens and the `actual`/`expected`/`diff` triples the
      # harness writes on a mismatch, so a reviewer can look at what changed
      # rather than take the run's word for it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixtures-${{ inputs.os || matrix.os }}
          path: |
            fixtures/**/expected.*.png
            target/fixtures/**
          if-no-files-found: error
          retention-days: 7
