name: encode-hashes

# Measures the encode-agreement hashes on another platform and uploads them.
# `encode_agreement.rs` and its TypeScript half compare against macOS's
# `flat-hashes.txt` with per-platform overlays; `windows-x86_64` moves `tiff`
# only. It commits nothing: a person writes the overlay, as with `fixtures.yml`.
run-name: >-
  encode-hashes — measure on ${{ inputs.os || 'every runner' }}

on:
  workflow_dispatch:
    inputs:
      os:
        description: 'The runner to measure on'
        type: choice
        options: [windows-latest, ubuntu-latest, macos-latest]
        default: windows-latest
  push:
    branches: ['encode-hashes/**']

permissions:
  contents: read

# Keyed by ref and by runner, because measuring one branch on Windows and on
# Linux is the ordinary use and those two must not cancel each other. A run
# that has spent an hour building Skia is not superseded by a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.os || 'matrix' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  measure:
    name: measure on ${{ inputs.os || matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ inputs.os && fromJSON(format('["{0}"]', inputs.os)) || fromJSON('["windows-latest","ubuntu-latest"]') }}
    runs-on: ${{ inputs.os || matrix.os }}
    # A cold Skia is the long pole, as it is in `fixtures.yml`. The bound is on
    # a build that has stopped rather than one that is slow.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          nightly=$(sed -n 's/^fmt_toolchain := "\(.*\)"$/\1/p' justfile)
          test -n "$nightly" || { echo "::error::the justfile named no fmt_toolchain"; exit 1; }
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Unused here, installed for the cache key, as in `fixtures.yml`.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.nightly }}

      # rust-cache hashes every installed toolchain into its key, and the image's
      # own `stable` moves on its own schedule (1.99.0 in one Windows run, 1.99.1
      # in the next). Only what the repository pins stays, so the three workflows
      # sharing this cache compute one key.
      - name: Keep only the pinned toolchains
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
          NIGHTLY: ${{ steps.toolchain.outputs.nightly }}
        run: |
          # Empty, either pattern would match nothing and remove the pinned one.
          test -n "$CHANNEL" && test -n "$NIGHTLY" || { echo "::error::no pinned toolchain was read"; exit 1; }
          # On its own line, where a failing rustup fails the step; inside the
          # `for` it would run the loop zero times and leave the image's stable.
          installed=$(rustup toolchain list --quiet)
          for toolchain in $installed; do
            case "$toolchain" in
              "${CHANNEL}"-* | "${NIGHTLY}"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done

      # `ci.yml`'s entries, restored and never saved, as in `fixtures.yml`.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ inputs.os || matrix.os }}-ci
          save-if: 'false'

      # Pinned as `ci.yml` pins it: `just addon` below is a recipe, and a `just`
      # release could change it without a commit here.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      # What `ci.yml`'s job installs, and for its reasons: the addon and the Rust
      # test link libaom, assembled by yasm, and Skia, which probes for the font
      # headers through pkg-config. Vendor lists go first, as there.
      - name: Install what libaom needs
        if: runner.os == 'Linux'
        run: |
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y \
            cmake yasm \
            pkg-config libfontconfig1-dev libfreetype-dev

      # libaom's requirement only; Skia uses DirectWrite on Windows.
      - name: Install what libaom needs
        if: runner.os == 'Windows'
        # [WORKAROUND] libaom 3.11 refuses every nasm 3 (b:448994065), so NASM is
        # pinned to 2.16.03 as in `ci.yml`, until libaom-sys bundles libaom
        # 3.13.2; `crates/meo-canvas-core/tests/libaom_nasm_pin.rs` asserts it.
        run: |
          choco install nasm --version=2.16.3 --no-progress -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      - run: bun install --frozen-lockfile

      # The addon, because the JavaScript half renders through it. This is the
      # hour.
      - run: just addon

      # Both surfaces: Rust asserts and names the formats that moved, TypeScript
      # with `UPDATE_ENCODE_HASHES=1` prints the rows and writes nothing.
      # Neither fails the run, since a divergence is the measurement and a red
      # step would skip the upload.
      - name: Measure
        run: |
          set -uo pipefail
          mkdir -p target/encode-hashes
          {
            echo "runner: ${{ inputs.os || matrix.os }}"
            echo "commit: ${GITHUB_SHA}"
            echo
            echo "--- the Rust half, asserting"
            cargo test -p meo-canvas --test encode_agreement 2>&1 || true
            echo
            echo "--- the TypeScript half, reporting"
            UPDATE_ENCODE_HASHES=1 ./node_modules/.bin/vitest run encode.agreement 2>&1 || true
          } | tee "target/encode-hashes/${{ inputs.os || matrix.os }}.txt"

      # **`if-no-files-found: error`.** This step runs on every path, so no
      # rehearsal covers an empty upload -- and an artifact that came out empty
      # would download as nothing and read as "no rows differ", which is a
      # result rather than an absence.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encode-hashes-${{ inputs.os || matrix.os }}
          path: target/encode-hashes
          if-no-files-found: error
          retention-days: 7
