name: upstream-watch

# Reports upstream fixes merged into no release for defects this tree works
# around; a released fix already goes red through Dependabot and the probe.
# Weekly, since an upstream merge changes nothing here. The mechanism is
# described, not cited, since a reference spelled here becomes a watched row.

# Red on a reference it could not query or a merged, unreleased fix, since a
# finding in a green run is read by nobody; it clears when the workaround and
# its citation go. The name states the trigger only, being evaluated before the
# step decides.
run-name: upstream-watch — ${{ github.event_name }}

on:
  schedule:
    # Mondays, 07:00 UTC. A weekday morning rather than a weekend, so the run
    # that finds something lands where somebody is present to read it.
    - cron: '0 7 * * 1'
  # The first run of a new workflow and any run after an upstream release both
  # want a person's finger on it, and a schedule gives neither.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    # Seconds of API calls. The bound is on a wedged fetch, not on the work.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # The step runs the recipe, so the runner needs `just`: that keeps this
      # and a local `just upstream-watch` one command. Same action, commit and
      # version as the other workflows. `gh` is on every hosted runner.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - name: Watch
        env:
          # The default token reads public repositories, which is every
          # repository this tree cites. A reference to a private one would come
          # back as a 404 -- indistinguishable from a renamed repository, and
          # loud for that reason rather than silently skipped.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: just upstream-watch
