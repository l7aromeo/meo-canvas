name: ci

# The trigger names `main` alone: `v9` is frozen and ungated on purpose, and a
# trigger naming a branch nothing is pushed to is a gate that cannot run.
# `workflow_dispatch` asks "does this pass on Linux" without a push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read, stated rather than inherited: the repository default is `read`, and
# widening it is a settings page rather than a diff, which would hand every pull
# request's gate a writable token.
permissions:
  contents: read

# A push to a branch with a run going cancels that run: the older result
# describes code nobody has any more.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Every `run:` block here is bash. On `windows-latest` the default is
# PowerShell, and `Read the pinned toolchains` below is `grep | cut` -- which is
# exactly how `release.yml` failed its Windows job every run since it was
# written. Declared before the Windows row was added rather than after it failed.
defaults:
  run:
    shell: bash

jobs:
  # The half of the gate that reads the repository and never compiles it, once
  # rather than per host; the justfile's `portable` list decides membership. It
  # saves the slowest runner most: `typecheck` was 221s of a 959s Windows run
  # (34291240847). No Rust toolchain, since every recipe listed is `cargo`-free.
  portable:
    name: portable
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A job's `permissions:` replaces the workflow's, so `contents: read` is
    # restated. `actions: read` is for `cache-budget-check`, which lists the
    # caches, and is granted only here, away from the legs that run third-party
    # build tooling.
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # `docs-js` installs the typedoc tool's own dependencies with bun, and
      # `ensure-deps` installs the workspace's, so bun is needed here even
      # though nothing in this job runs an example.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      - name: Install the JavaScript dependencies
        run: bun install --frozen-lockfile

      # The token is the one `actions: read` above authorises, and it is passed
      # rather than assumed: nothing is in a step's environment by default.
      - run: just portable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: ci (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A hang-breaker, not a budget: runs take 16 to 23 minutes, and 52 when a
    # `meo-skia-canvas` bump missed the Skia cache. Without it the default is
    # six hours.
    timeout-minutes: 90
    strategy:
      # Every platform reports. Cancelling the set on one failure hides whether
      # the fault is the code or the backend, which is the first thing to know.
      fail-fast: false
      matrix:
        # Windows because `win32-x64` is a published platform package: tested
        # here, or it does not belong in `TARGETS`.
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before the toolchain steps, which read a justfile variable through
      # `just`. The tool's version is pinned as well as the action's commit, or
      # a `just` release could change every recipe without a commit.
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: '1.58.0'

      # Both toolchains are read from the files that define them, so no version
      # lives in two places. The nightly comes from `just --evaluate`, which
      # resolves it as a recipe does; `rust-toolchain.toml`'s channel is read
      # with grep.
      - name: Read the pinned toolchains
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "nightly=$(just --evaluate fmt_toolchain)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, llvm-tools-preview

      # The nightly two recipes name: rustfmt for `fmt-check`, since
      # `rustfmt.toml` uses nightly-only options, and llvm-tools-preview for
      # `coverage`, since `--branch` needs `-Z coverage-options=branch`. Beside
      # the pinned stable; its date is `fmt_toolchain`, read above.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.nightly }}
          components: rustfmt, llvm-tools-preview

      # Caches ~/.cargo, with the tools below, and target/. Saves only on
      # `main`: pull request copies died unread and pushed past GitHub's 10 GB
      # limit, where eviction cold-starts a random leg at 3-4x its warm time.
      # The action exports `CARGO_INCREMENTAL=0` itself.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          cache-bin: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # A Node runtime for prettier, vitest and the tools; the packages
      # themselves are installed by bun below, so there is no npm cache to key.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # Ubuntu's archive only: cmake and nasm for libaom's x86 assembly, and
      # pkg-config with the fontconfig and freetype headers `rust-skia` probes
      # for. The runner's vendor lists go first, since one bad index fails
      # `apt-get update` wholesale (`dl.google.com`, 2026-09-09).
      - name: Install what libaom needs
        if: runner.os == 'Linux'
        run: |
          # Matched on content, not filename: the same repository registered as
          # `google-chrome.sources.list` survives a name-based `rm`, and
          # `apt-get update` still exits 100.
          sudo grep -rlE 'dl\.google\.com|packages\.microsoft\.com' \
            /etc/apt/sources.list.d/ 2>/dev/null | sudo xargs -r rm -f
          sudo apt-get update
          sudo apt-get install -y \
            cmake nasm \
            pkg-config libfontconfig1-dev libfreetype-dev

      # libaom's requirement only; cmake is on the image, nasm is not. No font
      # packages: Skia uses DirectWrite on Windows, which is also why
      # `win32-x64` has no `floors` in `TARGETS`.
      - name: Install what libaom needs
        if: runner.os == 'Windows'
        run: |
          choco install nasm --no-progress -y
          echo "C:\\Program Files\\NASM" >> "$GITHUB_PATH"

      # `just ci` runs the examples, and the JavaScript half of them runs under
      # bun rather than node -- it is a consumer of the published package and
      # is written the way one would be. Without this the gate fails at
      # `bun: command not found` on a runner, however green it is locally.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'

      # `--frozen-lockfile`: install exactly what `bun.lock` names and fail
      # when it and package.json disagree, which is what a check job wants to
      # hear about. The npm equivalent was `npm ci`.
      - name: Install the JavaScript dependencies
        run: bun install --frozen-lockfile

      # `--locked` so a run installs the versions the tools' own lockfiles
      # name, rather than whatever published since the last cache miss.
      - name: Install the cargo tools just ci calls
        run: cargo install --locked cargo-llvm-cov cargo-machete

      # `native`, not `ci`: the portable half runs in the job above, once. This
      # skips the lock `ci` takes as well, which guards one checkout against two
      # concurrent gates and has nothing to guard on a fresh runner.
      - run: just native

      # Advisories, once rather than three times: the lockfile is the same on
      # every runner, so this asks Linux and nobody else. Installed here rather
      # than in the line above for the same reason -- two of the three runners
      # would compile a tool they never call.
      - name: What the tree is known to be vulnerable to
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-audit
          just audit

      # The `net` feature, once on Linux like the advisory step: whether it
      # compiles is a fact about the code, not the host. Every `--features` in
      # the justfile names a GPU backend, so `just ci` never compiles
      # `fetch_policy.rs`. See `just net-check`.
      - name: Does the feature nothing else compiles still compile?
        if: runner.os == 'Linux'
        run: just net-check

      # An ordinary addon under vitest's threads pool, where the instrumented
      # one segfaults. It passes, so that crash is the profiling runtime's and
      # `worker_threads` works on Windows; this keeps it so. See `just
      # threads-probe`.
      - name: Does an ordinary addon survive worker threads?
        if: runner.os == 'Windows'
        run: just threads-probe
