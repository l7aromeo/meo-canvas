name: cache-prune

# Removes the Actions cache entries nothing will restore, which `just
# cache-budget-check` names but cannot delete. Fires after CI on `main`, where
# entries are superseded, and outside `ci.yml` so no pull request holds
# `actions: write`. Deletes only with `--delete`, set only here.

# The name states the trigger and no mode: it is evaluated before the step
# decides, so a mode here would be a second evaluation that can disagree. The
# step prints the mode it took, first and into the run summary.
run-name: cache-prune — ${{ github.event_name }}

on:
  # `workflow_run` runs this file as it stands on the default branch, so no pull
  # request can exercise this trigger, and it is the path that passes
  # `--delete`. `modeFrom` returns on the event before it reads `inputs.delete`,
  # so that value cannot change the mode here.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      delete:
        description: 'Delete, rather than printing what would be deleted'
        type: boolean
        default: false

# **The one job in this repository that can remove a cache.** `actions: write`
# covers both the list and the delete; nothing else here is granted it.
permissions:
  actions: write

# Two merges landing together would otherwise list the same caches and race to
# delete the same ids. The second waits rather than cancelling: a prune that has
# already deleted half its list is not superseded by a newer one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prune:
    name: prune
    # Every conclusion: past the floor `cache-budget-check` fails `ci` on
    # `main`, and a pruner declining failed runs declines the one it exists to
    # clear (run 34496520148, 8.42 GiB). The payload has no per-job result for
    # an `if:` to read; a needless run costs one `GET /actions/caches`.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    # Seconds of API calls. The bound is on a wedged fetch, not on the work.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*

      # **`--delete` on the automatic path and on a dispatch that asks for it.**
      # A dispatch defaults to false so that the manual route is a dry run
      # unless somebody says otherwise, and the automatic route is the one that
      # keeps the budget flat.
      - name: Prune
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # **Raw values, and no decision here.** `modeFrom` in
          # `cache-entries.mjs` turns these two strings into a mode, and its
          # own test runs before the network. `DELETE_INPUT` is empty on
          # `workflow_run` and `'true'` or `'false'` on a dispatch.
          EVENT: ${{ github.event_name }}
          # `inputs`, the documented context. On `workflow_run` `modeFrom` never
          # reads it; on a dispatch an unrecognised value is refused rather than
          # read as an intention.
          DELETE_INPUT: ${{ inputs.delete }}
        run: node packages/meo-canvas/tools/cache-prune.mjs
