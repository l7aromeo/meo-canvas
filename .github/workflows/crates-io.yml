name: crates-io

# A dry run and a real publish look identical in the Actions list unless the run
# says which it is.
run-name: >-
  ${{ inputs.dry_run && 'crates.io — DRY RUN (nothing is published)' || 'crates.io — publish' }}

# Manual only, for the same reason `release.yml` is: a push is how code arrives,
# and publishing is a decision about code that already arrived. `just
# release-crate` is what a person runs; this is what it triggers.
#
# **It cannot be triggered at all today, and that is not a defect in this
# file.** `workflow_dispatch` needs the workflow's path to exist on the
# repository's default branch, and the default is still `main` -- v1's, which
# carries `ci.yml`, `docs.yml` and `release.yml` and no `crates-io.yml`. So
# `gh workflow list --all` does not list this workflow and the API answers
# `workflow crates-io.yml not found on the default branch`; `just release-crate`
# fails there rather than here. `release.yml` is dispatchable only because its
# *path* happens to exist on `main`, and a dispatch of it at `ref: v10` runs
# v10's content -- which is why that one rehearses and this one has never run.
#
# `fixtures.yml` documents the same constraint and works around it with a push
# trigger. That is not available to a workflow that publishes: a push is how
# code arrives, which is the sentence above. **The fix is the branch swap**, and
# nothing here should be reshaped to anticipate it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify every crate, but publish nothing'
        type: boolean
        default: true

# `contents: write` is what lets the job tag the commit it published. crates.io
# has no provenance attestation to mint, so unlike the npm workflow there is no
# `id-token: write` here -- see the note on authentication below.
permissions:
  contents: write

# One publish at a time, and never cancelled -- the same reasoning as
# `release.yml`, which shares neither its registry nor its tag namespace with
# this workflow but has exactly its shape: `cargo publish --workspace` uploads
# four crates in sequence, then a tag is pushed and a release opened.
#
# The group omits the ref on purpose. Two dispatches at different refs publish
# the same version to the same registry and push the same `rust-v<version>`
# tag, so keying on the ref would let precisely the pair that collides run side
# by side. And cancelling mid-publish leaves crates.io and this repository
# disagreeing, with nothing that re-runs to fix it -- crates.io has no
# unpublish, only yank.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # `cargo publish` builds every crate it packages, and three of the four
    # reach `meo-skia-canvas`, so this compiles the Skia chain on a cold cache
    # the first time. The bound is the one `ci.yml` uses for the same build,
    # and it exists because the alternative is six hours of a runner holding a
    # publish nobody can see the state of.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the tag step below asks whether its own
          # tag already exists and a shallow clone fetches none. The notes no
          # longer need it -- they are read from a file in the tree -- but the
          # existence check is what makes a re-run safe, so the depth stays.
          fetch-depth: 0

      # The same block-scalar read `release.yml` uses, and for the same reason:
      # written on one line this needs `cut -d'\"'`, where YAML keeps the
      # backslash literal and the step succeeds while writing nothing.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "toolchain $channel"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # **Saved on a branch, never on a tag -- and unlike `release.yml`, this is
      # an argument by analogy and not a measurement.** This workflow has never
      # run, not once, so there is no hit or miss in its history to reason from.
      # What transfers is the scoping rule rather than any observation: a run
      # restores from its own ref's scope and from the default branch, so a run
      # dispatched at a tag cannot read back what it writes, and every release
      # carries a new tag.
      #
      # **What would falsify it:** a tag-dispatched run of this workflow
      # reporting `Cache hit for:`. That would mean the scoping premise is wrong
      # and this line should go.
      #
      # **What it cannot do is harm.** If this workflow is only ever dispatched
      # from a branch, the predicate never fires and nothing changes. It
      # suppresses a save only on the dispatch that provably cannot read one.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: crates-io
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # `cargo publish` does not merely upload a tarball: it unpacks each one
      # into `target/package/` and **builds it**. Three of the four crates reach
      # `meo-skia-canvas`, so this job compiles the same native chain the addon
      # build does and needs the same system libraries present.
      #
      # `cmake` and `nasm` are libaom's, for the reason `release.yml` states at
      # its own copy of this step. The list is the one MEASURED against a build
      # in an `ubuntu:24.04` container, not the one reasoned from the error.
      #
      # **`pkg-config` is the load-bearing one and the easiest to omit.** Skia
      # is built without `embed-freetype`, so `rust-skia` links the system
      # copies -- and `skia-bindings`' `build_support/platform/linux.rs:37-41`
      # probes pkg-config and **falls back to bare library names when the probe
      # fails, silently**. Without `pkg-config` the probe does not complain, it
      # just stops producing a link line, and the failure surfaces as
      # `unable to find library -lfreetype`, which points at freetype rather
      # than at the missing prober.
      #
      # `libfreetype-dev` rather than `libfreetype6-dev`: the first is what was
      # installed and observed to work on 24.04.
      #
      # **These are BUILD packages and not runtime ones.** A consumer running
      # what this builds needs `libfontconfig1 libfreetype6` on Debian, or
      # `fontconfig freetype` on EL -- see the crate README. Building with only
      # the set below and then failing at load reads as a broken crate rather
      # than a missing system library.
      - name: Install what the verification build needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake nasm \
            pkg-config libfontconfig1-dev libfreetype-dev

      # **The rehearsal always runs, including on a real publish.**
      #
      # `--workspace` is what makes this safe, and it is not the same thing as
      # four `cargo publish` calls in a loop. Cargo packages and verifies EVERY
      # member before it uploads ANY of them, resolving each crate's internal
      # dependencies against a temporary registry it builds from the packaged
      # tarballs (`target/package/tmp-registry`) rather than against the paths
      # in the working tree. Two things follow:
      #
      # 1. It computes the dependency order itself -- scene, core, canvas, cli
      #    -- so the order is not written down here to drift.
      # 2. A crate that fails to build fails before the first upload. That is
      #    the failure this whole file is shaped around: crates.io has no
      #    unpublish, only yank, and a yanked version still resolves for
      #    existing lockfiles, so a half-published version can never be
      #    reissued.
      #
      # A loop of per-crate publishes cannot do either. It also cannot be
      # rehearsed at all before the first release: `cargo publish --dry-run -p
      # meo-canvas-core` fails with `no matching package named
      # meo-canvas-scene found` on a workspace where nothing is on the registry
      # yet, because per-crate verification resolves internal dependencies
      # through crates.io. `--workspace` is the only spelling that can be
      # practised before it is used.
      #
      # **What this rehearsal cannot see, and what closes the gap.** The
      # temporary registry is built from the tarballs it then verifies, so both
      # sides of the check come from the working tree: it cannot detect that a
      # member declares a dependency version crates.io does not have, because it
      # satisfies that dependency locally either way. What closes it is
      # `version.workspace` -- all four crates share one version, so an internal
      # dependency cannot name something this same batch will not create.
      #
      # That is a reason, not a property, and it stops holding the day the
      # workspace version is split. It would reopen silently, because this step
      # would stay green.
      - name: Package and verify every crate
        run: cargo publish --workspace --dry-run

      # `meo-canvas-node` is absent from both this step and the one above
      # without being named: it carries `publish = false`, so `--workspace`
      # skips it. Excluding it here as well would be a second place to keep in
      # step with the manifest.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          # crates.io has no OIDC path for a crate that does not exist yet --
          # Trusted Publishing is configured per crate, on a crate already
          # published -- so the first release needs a token. Once all four
          # exist, this can become `rust-lang/crates-io-auth-action` and the
          # secret can be deleted, which is the arrangement the npm job already
          # has and the one this repository prefers.
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "${CARGO_REGISTRY_TOKEN}" || {
            echo "::error::CARGO_REGISTRY_TOKEN is not set; nothing was published"
            exit 1
          }
          cargo publish --workspace

      # Tag AFTER the registry has accepted everything, never before. A tag
      # pushed first and a publish that then fails leaves a tag with no release
      # under it and a version that can never be reissued -- `meo-skia-canvas`
      # has that scar. Tagging last means a failed publish leaves the tree
      # exactly as it was.
      #
      # **The prefix is `rust-v`, and the npm side now carries `npm-v`.** The
      # two version lines are independent -- npm continues v1 at 10.x, the
      # crates start fresh at 0.1.0 -- so a shared namespace was never right,
      # and a crate tag named `v0.1.0` would once have become the "previous
      # tag" for the next npm release and silently truncated its notes to a
      # range across two lineages. That particular failure is gone with the
      # generated notes; the namespaces stay separate because the releases
      # are, and because `docs.yml` decides whether a tag has a JavaScript
      # reference by its prefix.
      #
      # This lineage has no published tags yet, so the rename from `crates-v`
      # costs nothing and rewrites nothing. The npm side's 68 `v*` tags were
      # left alone, which is why `docs.yml` accepts both spellings there.
      - name: Tag the commit and open a release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `jq` rather than `node`: this job never sets Node up, and a step
          # that happens to work because the runner image ships one is a step
          # that breaks when the image changes. The four crates share a version
          # through `version.workspace`, so any one of them answers for all.
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "meo-canvas") | .version')
          test -n "$version" || { echo "::error::could not read the crate version"; exit 1; }
          git_tag="rust-v${version}"

          # **Written by hand, per version, and a missing file stops the
          # release** -- the same rule `release.yml` follows and for the same
          # reason. A range of subjects described one lineage when there was
          # one lineage; with two channels cutting from the same trunk, the
          # commits between two crate releases include every npm-side change
          # and every gate edit, and a page listing all of them tells a crate
          # consumer nothing. Written against the previous release of THIS
          # channel is the whole point of the split.
          #
          # No fallback to the log. A fallback would make this unable to fail.
          notes_source="docs/releases/rust/${version}.md"
          if [ ! -s "${notes_source}" ]; then
            echo "::error::${notes_source} is missing or empty. Release notes are written by hand, per channel and per version, against the previous release of that channel. Write it, commit it, and run this again."
            exit 1
          fi
          echo "notes from ${notes_source}"

          {
            echo "\`cargo add meo-canvas@${version}\`"
            echo ""
            echo "Published: \`meo-canvas-scene\`, \`meo-canvas-core\`, \`meo-canvas\`, \`meo-canvas-cli\`, all at ${version}."
            echo ""
            cat "${notes_source}"
          } > notes.md

          # **Both halves ask whether they have already happened**, because
          # the step before this one is `cargo publish --workspace` and
          # crates.io has no unpublish. A failure between the upload and the
          # tag used to be terminal here: the crates are on the registry, the
          # re-run dies at `git tag` because the tag now exists, and there is
          # no path that finishes the job. `release.yml` learned this on
          # 5 September 2026 and carries the same guard; this workflow has
          # never run, so it was still carrying the version that fails.
          #
          # A tag at a different revision is a real conflict rather than
          # something to walk past -- someone published this version from
          # elsewhere -- so it stops rather than attaching a release to a
          # commit this run did not build. Tags are local because the checkout
          # above takes `fetch-depth: 0`.
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/${git_tag}^{commit}"); then
            if [ "$existing" != "$head" ]; then
              echo "::error::${git_tag} already exists at ${existing}, and this run published ${head}"
              exit 1
            fi
            echo "${git_tag} already exists at this commit; not creating it again"
          else
            # **An annotated tag records who made it, so the runner needs an
            # identity.** Without one `git tag -a` exits 128 with "empty ident
            # name" -- which is exactly how `release.yml` died on run
            # 33966045288 with every package already on npm. This workflow
            # has the same `git tag -a` and had no `git config` anywhere in
            # it, so its first real run would have reproduced that failure
            # with four crates already on crates.io behind it.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${git_tag}" -m "meo-canvas crates ${version}"
          fi
          # A no-op when the remote already has this exact tag, and a rejection
          # if it has a different one.
          git push origin "${git_tag}"

          # `--prerelease` on the same rule cargo uses to decide a version is a
          # prerelease: a hyphen in the version string.
          case "${version}" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          # Guarded for the same reason the tag is: a re-run after the
          # release was opened must walk past it rather than fail.
          if gh release view "${git_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "a release already exists under ${git_tag}; not opening a second one"
          else
            # shellcheck disable=SC2086
            gh release create "${git_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "crates ${version}" \
              --notes-file notes.md \
              ${prerelease}
          fi
