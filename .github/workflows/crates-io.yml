name: crates-io

# A dry run and a real publish look identical in the Actions list unless the run
# says which it is.
run-name: >-
  ${{ inputs.dry_run && 'crates.io — DRY RUN (nothing is published)' || 'crates.io — publish' }}

# Manual only, as `release.yml` is: publishing is a decision about code that
# already arrived. `just release-crate` is what a person runs to dispatch it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Package and verify every crate, but publish nothing'
        type: boolean
        default: true

# `contents: write` lets the job tag what it published. `id-token: write` lets
# it trade an OIDC token for a short-lived crates.io one; crates.io mints no
# attestation, so the npm job holds the same line for a different reason.
permissions:
  contents: write
  id-token: write

# One publish at a time, never cancelled. The group omits the ref, since two
# dispatches at different refs publish the same version and push the same
# `rust-v<version>` tag. Cancelling mid-publish leaves crates.io and the
# repository disagreeing, and crates.io has no unpublish.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    # `cargo publish` builds each crate it packages, and three reach
    # `meo-skia-canvas`, so a cold cache compiles Skia. The bound is `ci.yml`'s
    # for the same build; the default is six hours.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the tag step below asks whether its own
          # tag already exists and a shallow clone fetches none. The notes no
          # longer need it -- they are read from a file in the tree -- but the
          # existence check is what makes a re-run safe, so the depth stays.
          fetch-depth: 0

      # The same block-scalar read `release.yml` uses, and for the same reason:
      # written on one line this needs `cut -d'\"'`, where YAML keeps the
      # backslash literal and the step succeeds while writing nothing.
      - name: Read the pinned toolchain
        id: toolchain
        run: |
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d'"' -f2)
          test -n "$channel" || { echo "::error::rust-toolchain.toml named no channel"; exit 1; }
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "toolchain $channel"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      # Restores and never saves, as `release.yml` does: a per-push cache budget
      # is the wrong place for warmth a workflow dispatched weekly would use.
      # Saving off also skips the post step's walk of `target/`, which prints
      # ten `ENOENT` errors on a green run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: crates-io
          save-if: false

      # `cargo publish` builds each crate in `target/package/`, so this needs
      # the addon build's libraries: cmake and nasm for libaom, and
      # `pkg-config`, without which `skia-bindings` fails at `-lfreetype`. Build
      # packages only; the crate README names the runtime ones.
      - name: Install what the verification build needs
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cmake nasm \
            pkg-config libfontconfig1-dev libfreetype-dev

      # Always runs, including on a real publish. `--workspace` verifies every
      # member against a registry built from the packaged tarballs before
      # uploading any, and orders them itself. It cannot see a dependency on a
      # version crates.io lacks; the shared `version.workspace` rules that out.
      - name: Package and verify every crate
        run: cargo publish --workspace --dry-run

      # Trusted Publishing: each crate names this repository and workflow as
      # publisher and requires it for new versions, so a token would be
      # rejected. The OIDC exchange is short-lived and scoped to this run,
      # leaving no secret to leak or rotate.
      - name: Authenticate to crates.io
        if: ${{ !inputs.dry_run }}
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth

      # `meo-canvas-node` is `publish = false`, so `--workspace` skips it here
      # and in the verification above without naming it.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace

      # Tag after the registry accepts everything: a tag pushed before a failed
      # publish marks a version that can never be reissued. `rust-v`, apart from
      # `npm-v`, because the lineages version independently and `docs.yml` picks
      # tags with a JavaScript reference by prefix.
      - name: Tag the commit and open a release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `jq` rather than `node`: this job never sets Node up, and a step
          # that happens to work because the runner image ships one is a step
          # that breaks when the image changes. The four crates share a version
          # through `version.workspace`, so any one of them answers for all.
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "meo-canvas") | .version')
          test -n "$version" || { echo "::error::could not read the crate version"; exit 1; }
          git_tag="rust-v${version}"

          # Hand-written per version, and a missing file stops the release, as
          # in `release.yml`: the log between two crate releases carries every
          # npm change too. No fallback to the log, which would make this unable
          # to fail.
          notes_source="docs/releases/rust/${version}.md"
          if [ ! -s "${notes_source}" ]; then
            echo "::error::${notes_source} is missing or empty. Release notes are written by hand, per channel and per version, against the previous release of that channel. Write it, commit it, and run this again."
            exit 1
          fi
          echo "notes from ${notes_source}"

          {
            echo "\`cargo add meo-canvas@${version}\`"
            echo ""
            echo "Published: \`meo-canvas-scene\`, \`meo-canvas-core\`, \`meo-canvas\`, \`meo-canvas-cli\`, all at ${version}."
            echo ""
            cat "${notes_source}"
          } > notes.md

          # Both halves ask whether they already happened, since crates.io has
          # no unpublish: a re-run after a failure past the upload finishes what
          # is left. A tag at another revision is a conflict and stops the run.
          # Tags are local because the checkout takes `fetch-depth: 0`.
          head=$(git rev-parse HEAD)
          if existing=$(git rev-parse -q --verify "refs/tags/${git_tag}^{commit}"); then
            if [ "$existing" != "$head" ]; then
              echo "::error::${git_tag} already exists at ${existing}, and this run published ${head}"
              exit 1
            fi
            echo "${git_tag} already exists at this commit; not creating it again"
          else
            # An annotated tag records its author, so the runner needs an
            # identity: without one `git tag -a` exits 128 with "empty ident
            # name", as `release.yml` did on run 33966045288.
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "${git_tag}" -m "meo-canvas crates ${version}"
          fi
          # A no-op when the remote already has this exact tag, and a rejection
          # if it has a different one.
          git push origin "${git_tag}"

          # `--prerelease` on the same rule cargo uses to decide a version is a
          # prerelease: a hyphen in the version string.
          case "${version}" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          # Guarded for the same reason the tag is: a re-run after the
          # release was opened must walk past it rather than fail.
          if gh release view "${git_tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "a release already exists under ${git_tag}; not opening a second one"
          else
            # shellcheck disable=SC2086
            gh release create "${git_tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "crates ${version}" \
              --notes-file notes.md \
              ${prerelease}
          fi
