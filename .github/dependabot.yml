# Every `uses:` is pinned to a commit SHA, which never moves, not even for a
# security advisory, so this moves the pins. Grouped and weekly, since an
# updater's failure mode is a queue of pull requests nobody reads.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'Update'

  # The Rust dependencies. `skia-safe` is not really ours to move -- it arrives
  # through `meo-skia-canvas`, which pins it -- so most of what this sees is the
  # small end of the tree, which is exactly where an unread advisory hides.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ['*']
    commit-message:
      prefix: 'Update'

# No JavaScript updates: those versions are chosen against each other.
# TypeScript is held at 6.0.3, the newest typescript-eslint and TypeDoc support,
# so an updater would reopen the same pull requests weekly. Revisit when those
# constraints lift.
